name: Apply Project Cleanup From PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-project-cleanup-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and apply cleanup payload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .project-cleanup-work
          cat .project-cleanup-payload/part-* | base64 -d > .project-cleanup-work/payload.tar.gz
          echo "fdb5d267eae3f3c836c7335b513929c945afc12801ca9f3f6fa63733a7736e22  .project-cleanup-work/payload.tar.gz" | sha256sum -c -
          tar -xzf .project-cleanup-work/payload.tar.gz -C .project-cleanup-work
          bash .project-cleanup-work/apply.sh
          rm -f .github/workflows/apply-project-cleanup-pr.yml

      - name: Validate complete cleanup
        shell: bash
        run: |
          set -euxo pipefail
          npm test
          npm run verify:source
          python -m py_compile tools/prepare-pages-site.py
          test ! -e app
          test ! -e cpp
          test ! -e .project-cleanup-payload
          test ! -e .github/workflows/apply-project-cleanup.yml
          test ! -e .github/workflows/apply-project-cleanup-pr.yml

      - name: Commit complete cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "移除桌面版並整理工作台架構"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
