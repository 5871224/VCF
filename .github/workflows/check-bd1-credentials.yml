name: Check BD1 deploy credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-bd1-credentials.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check credential availability
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && echo "FTP_SERVER=present" || echo "FTP_SERVER=missing"
          test -n "$FTP_USERNAME" && echo "FTP_USERNAME=present" || echo "FTP_USERNAME=missing"
          test -n "$FTP_PASSWORD" && echo "FTP_PASSWORD=present" || echo "FTP_PASSWORD=missing"
          test -n "$FTP_SERVER_DIR" && echo "FTP_SERVER_DIR=present" || echo "FTP_SERVER_DIR=missing"
