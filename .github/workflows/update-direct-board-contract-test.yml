name: One-time board interaction contract test update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-direct-board-contract-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Update board interaction architecture contract
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/workbench-architecture.test.js')
          text = p.read_text(encoding='utf-8')
          old = "    || !entry.includes('rapfi/vcf-record-tools.js?v=20260826-record-tools-v2')) {"
          new = "    || !entry.includes('rapfi/vcf-record-tools.js?v=20260913-direct-board-edit')) {"
          if old not in text:
              raise SystemExit('old record-tools cache contract not found')
          text = text.replace(old, new, 1)
          anchor = 'const recordToolsMarkerToggle = read("rapfi/vcf-record-tools.js");\n'
          addition = "\n".join([
              'const recordToolsMarkerToggle = read("rapfi/vcf-record-tools.js");',
              'for (const token of [',
              "  'const SETTINGS_VERSION = 2;',",
              "  'editMode: true,',",
              "  'if (savedVersion < SETTINGS_VERSION) state.editMode = true;',",
              "  'JSON.stringify({ ...state, version: SETTINGS_VERSION })',",
              ']) if (!recordToolsMarkerToggle.includes(token)) throw new Error(`direct board edit contract missing: ${token}`);',
              '',
          ])
          if anchor not in text:
              raise SystemExit('record-tools contract anchor not found')
          text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
          node tests/workbench-architecture.test.js
          git diff --check

      - name: Commit test update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/workbench-architecture.test.js
          git commit -m 'Update direct board edit architecture contract'
          git push
