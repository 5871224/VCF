name: Fix catch-forbidden route validation once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-catch-forbidden-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch route validation, tests, and spec
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          engine_path = Path('rapfi/vcf-bitboard-engine.cpp')
          engine = engine_path.read_text(encoding='utf-8')

          old_route = '''            const std::vector<uint8_t> wins = immediateWinningPoints(board, attacker, rule, 2);
                      if (wins.size() >= 2)
                          return true;
                      if (wins.size() != 1)
                          return false;
                      if (ply + 1 >= routeLen || route[ply + 1] != wins.front())
                          return false;
          '''
          new_route = '''            const std::vector<uint8_t> wins = immediateWinningPoints(board, attacker, rule, 2);
                      if (wins.size() >= 2)
                          return true;
                      if (wins.size() != 1)
                          return false;

                      const uint8_t defense = wins.front();
                      const MoveAnalysis defenseAnalysis = analyzePoint(board, defense, defender, rule);
                      if (!legalMove(defenseAnalysis, defender, rule))
                          return true;
                      if (ply + 1 >= routeLen || route[ply + 1] != defense)
                          return false;
          '''
          if engine.count(old_route) != 1:
              raise SystemExit('routeStillWins target block not found exactly once')
          engine = engine.replace(old_route, new_route, 1)

          old_test = '''    const auto before = board.black;
              board.play(0, WHITE);
              board.undo(0);
              if (before != board.black || board.cells[0] != EMPTY)
                  return 4;

              return 0;
          '''
          new_test = '''    const auto before = board.black;
              board.play(0, WHITE);
              board.undo(0);
              if (before != board.black || board.cells[0] != EMPTY)
                  return 4;

              // 白棋最後一手形成唯一連五點，而黑棋落在該點會成為長連禁手。
              // 固定路線驗證必須把這種抓禁視為白棋仍勝，且無關的預補黑子不能解禁。
              BitBoardState catchFoul;
              catchFoul.clear();
              for (int x = 0; x <= 3; x++)
                  catchFoul.play(7 * BOARD_SIZE + x, BLACK);
              catchFoul.play(7 * BOARD_SIZE + 5, BLACK);
              catchFoul.play(2 * BOARD_SIZE + 4, BLACK);
              for (int y = 3; y <= 5; y++)
                  catchFoul.play(y * BOARD_SIZE + 4, WHITE);

              const uint8_t catchRoute[] = {uint8_t(6 * BOARD_SIZE + 4)};
              SearchContext catchCtx;
              catchCtx.maxNodes = 100000;
              catchCtx.maxDepth = 3;
              if (!routeStillWins(catchFoul, WHITE, RENJU, catchRoute, 1, catchCtx))
                  return 5;

              catchFoul.play(14 * BOARD_SIZE + 14, BLACK);
              SearchContext catchDefenseCtx;
              catchDefenseCtx.maxNodes = 100000;
              catchDefenseCtx.maxDepth = 3;
              if (!routeStillWins(catchFoul, WHITE, RENJU, catchRoute, 1, catchDefenseCtx))
                  return 6;

              return 0;
          '''
          if engine.count(old_test) != 1:
              raise SystemExit('self-test target block not found exactly once')
          engine = engine.replace(old_test, new_test, 1)
          engine_path.write_text(engine, encoding='utf-8')

          spec_path = Path('新版Bitboard VCF規格.MD')
          spec = spec_path.read_text(encoding='utf-8')
          old_spec = '''- 「VCF 防守」針對目前顯示路線取得直接防守點。
          - 「全部 VCF 防守」先取得候選防點，再逐點放入守方棋，排除放入後仍有 VCF 的位置。
          '''
          new_spec = '''- 「VCF 防守」針對目前顯示路線取得直接防守點。
          - 「全部 VCF 防守」先取得候選防點，再逐點放入守方棋，排除放入後仍有 VCF 的位置。
          - 固定路線驗證在攻擊後只剩一個連五點時，必須先檢查守方落在該點是否合法；有禁規則下黑棋若為長連、四四或三三禁手，該路線仍視為白棋獲勝，不要求手順包含非法防守手。
          - 抓禁路線只有在預補守方棋後使唯一防點變為合法，且完整路線不再成立時，該預補點才算防點；無關點不得因手順在攻擊手結束而被誤判為防點。
          - 長連禁手無法透過額外補黑解禁。
          '''
          if spec.count(old_spec) != 1:
              raise SystemExit('VCF defense spec target block not found exactly once')
          spec = spec.replace(old_spec, new_spec, 1)
          spec_path.write_text(spec, encoding='utf-8')

          Path('.github/workflows/fix-catch-forbidden-once.yml').unlink()
          PY

      - name: Build and run Bitboard self-tests
        shell: bash
        run: |
          set -euxo pipefail
          g++ rapfi/vcf-pattern-engine-optimized.cpp \
              rapfi/vcf-bitboard-engine.cpp \
              rapfi/vcf-bitboard-search-v2.cpp \
              rapfi/vcf-bitboard-legacy-extra.cpp \
              -O3 -flto -DNDEBUG -std=c++17 \
              -DVCF_BITBOARD_TEST_MAIN \
              -o /tmp/vcf-bitboard-engine-test
          /tmp/vcf-bitboard-engine-test

      - name: Commit directly to main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '修正白棋抓禁路線防守判定'
          git push origin HEAD:main
