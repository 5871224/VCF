name: One-time record navigation fix

on:
  push:
    paths:
      - .github/workflows/one-time-record-nav-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch record navigation placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          layout_path = Path('makevcf-layout.js')
          s = layout_path.read_text(encoding='utf-8')

          old = '  boardCard.append(boardWrap, status);\n'
          new = '''  boardCard.append(boardWrap, status);\n\n  const recordNavigation = document.createElement("section");\n  recordNavigation.id = "vcf-record-navigation";\n  recordNavigation.className = "vcf-record-navigation";\n  recordNavigation.innerHTML = `\n    <div class="vcf-record-navigation-heading">\n      <strong>棋譜導覽</strong>\n      <span>逐手瀏覽目前 VCF 或已讀取的 Rapfi DB／RenLib 分支棋譜。</span>\n    </div>\n    <div id="vcf-record-navigation-actions" class="vcf-record-navigation-actions"></div>\n  `;\n  boardCard.appendChild(recordNavigation);\n'''
          if old not in s:
              raise SystemExit('boardCard anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const previousBranchButton = document.getElementById("btn-vcf-prev");\n  const nextBranchButton = document.getElementById("btn-vcf-next");\n  if (previousBranchButton) {\n    analysisActions.insertBefore(prevStepButton, previousBranchButton);\n    analysisActions.insertBefore(nextStepButton, previousBranchButton);\n  } else {\n    analysisActions.append(prevStepButton, nextStepButton);\n  }\n'''
          new = '''  const previousBranchButton = document.getElementById("btn-vcf-prev");\n  const nextBranchButton = document.getElementById("btn-vcf-next");\n  const recordNavigationActions = document.getElementById("vcf-record-navigation-actions");\n  if (recordNavigationActions) {\n    recordNavigationActions.append(prevStepButton, nextStepButton);\n    if (previousBranchButton) recordNavigationActions.appendChild(previousBranchButton);\n    if (nextBranchButton) recordNavigationActions.appendChild(nextBranchButton);\n  } else if (previousBranchButton) {\n    analysisActions.insertBefore(prevStepButton, previousBranchButton);\n    analysisActions.insertBefore(nextStepButton, previousBranchButton);\n  } else {\n    analysisActions.append(prevStepButton, nextStepButton);\n  }\n'''
          if old not in s:
              raise SystemExit('navigation insertion anchor not found')
          s = s.replace(old, new, 1)

          old = '''    .vcf-board-wrap {\n      display: flex;\n      justify-content: center;\n      width: 100%;\n    }\n\n    #vcf-app-shell #board-svg {\n'''
          new = '''    .vcf-board-wrap {\n      display: flex;\n      justify-content: center;\n      width: 100%;\n    }\n\n    .vcf-record-navigation {\n      width: 100%;\n      margin-top: 12px;\n      padding: 10px;\n      border: 1px solid #d8caa8;\n      border-radius: 9px;\n      background: #faf6e9;\n    }\n\n    .vcf-record-navigation-heading {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 8px;\n      margin-bottom: 8px;\n      color: #46391f;\n      font-size: 13px;\n    }\n\n    .vcf-record-navigation-heading span {\n      color: var(--vcf-muted);\n      font-size: 12px;\n      text-align: right;\n    }\n\n    .vcf-record-navigation-actions {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 6px;\n      width: 100%;\n    }\n\n    #vcf-record-navigation-actions button {\n      min-height: 38px;\n      padding: 7px 5px;\n      font-size: 13px;\n    }\n\n    #vcf-app-shell #board-svg {\n'''
          if old not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old, new, 1)

          old = '''      #vcf-app-shell #status { margin-top: 9px; }\n    }\n'''
          new = '''      #vcf-app-shell #status { margin-top: 9px; }\n      .vcf-record-navigation-heading { align-items: flex-start; flex-direction: column; }\n      .vcf-record-navigation-heading span { text-align: left; }\n      .vcf-record-navigation-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    }\n'''
          if old not in s:
              raise SystemExit('mobile CSS anchor not found')
          s = s.replace(old, new, 1)
          layout_path.write_text(s, encoding='utf-8')

          html_path = Path('makevcf.html')
          h = html_path.read_text(encoding='utf-8')
          if '<title>制作VCF</title>' not in h:
              raise SystemExit('HTML title anchor not found')
          h = h.replace('<title>制作VCF</title>', '<title>五子棋工作台</title>', 1)
          html_path.write_text(h, encoding='utf-8')

          test_path = Path('tests/workbench-architecture.test.js')
          t = test_path.read_text(encoding='utf-8')
          old = 'const layout = read("makevcf-layout.js");\nfor (const token of [\n'
          new = 'const layout = read("makevcf-layout.js");\nnew Function(layout); // parse the actual browser layout script, not only string contracts\nfor (const token of [\n'
          if old not in t:
              raise SystemExit('test layout anchor not found')
          t = t.replace(old, new, 1)
          old = '  \'window.vcfWithBoardChangeSource("record-playback"\',\n])'
          new = '  \'window.vcfWithBoardChangeSource("record-playback"\',\n  \'recordNavigation.id = "vcf-record-navigation"\',\n])'
          if old not in t:
              raise SystemExit('test token anchor not found')
          t = t.replace(old, new, 1)
          test_path.write_text(t, encoding='utf-8')

          spec_path = Path('規格書.MD')
          spec = spec_path.read_text(encoding='utf-8')
          anchor = '- 沒有 VCF 結果時，匯出只包含目前盤面；有單組或多組結果時，匯出目前可用的完整 VCF 路線集合。\n'
          addition = anchor + '- 工作台可直接讀取 Rapfi YXDB `.db`（含 Rapfi 預設 LZ4 frame）與 RenLib `.lib`；棋盤下方固定顯示「棋譜導覽」，提供「上一步、下一步、前一分支、後一分支」四個按鈕。沒有可瀏覽內容時按鈕仍保留固定位置，不得因無棋譜而隱藏。\n'
          if anchor not in spec:
              raise SystemExit('spec anchor not found')
          spec = spec.replace(anchor, addition, 1)
          spec_path.write_text(spec, encoding='utf-8')
          PY

          node --check makevcf-layout.js
          npm run test:architecture

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html makevcf-layout.js tests/workbench-architecture.test.js 規格書.MD
          git commit -m "固定顯示棋譜導覽並補語法檢查"
          git push origin HEAD:main
