name: Apply Runtime Optimization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-optimization.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reduce-redundant-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v6
        with:
          ref: agent/reduce-redundant-validation
          fetch-depth: 0

      - name: Reconstruct and verify optimizer
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/runtime-opt.part00 .github/runtime-opt.part01 .github/runtime-opt.part02 .github/runtime-opt.part03 \
            | base64 --decode > .github/apply-runtime-optimization.py
          echo '6339fd687685ad470de6d02b538086e088256e43cce27c4bf14c82677d5a388e  .github/apply-runtime-optimization.py' | sha256sum --check -

      - name: Apply verified optimization
        run: python .github/apply-runtime-optimization.py

      - name: Remove transfer chunks
        run: rm -f .github/runtime-opt.part00 .github/runtime-opt.part01 .github/runtime-opt.part02 .github/runtime-opt.part03

      - name: Validate optimized sources
        shell: bash
        run: |
          set -euxo pipefail
          for file in \
            rapfi/vcf-bitboard-worker.js \
            rapfi/vcf-bitboard-main.js \
            rapfi/vcf-candidate-worker.js \
            rapfi/rapfi-bitboard-dashboard.js \
            makevcf-generator-core.js \
            makevcf-generator-validate.js \
            tests/runtime-performance-contract.test.js \
            tests/bitboard-worker-runtime.test.js; do
            node --check "$file"
          done
          npm test
          git diff --check

      - name: Commit verified optimization
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '精簡重複驗證並降低熱路徑配置'
          git push origin HEAD:agent/reduce-redundant-validation
