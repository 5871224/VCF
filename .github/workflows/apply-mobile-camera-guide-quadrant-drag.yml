name: Apply mobile camera guide and quadrant drag

on:
  push:
    branches: [main]
    paths:
      - tools/apply-mobile-camera-guide-quadrant-drag.js
      - .github/workflows/apply-mobile-camera-guide-quadrant-drag.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate patch script
        run: node --check tools/apply-mobile-camera-guide-quadrant-drag.js

      - name: Apply mobile camera and drag changes
        run: node tools/apply-mobile-camera-guide-quadrant-drag.js

      - name: Validate generated page and specification
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('makevcf.html').read_text(encoding='utf-8')
          spec = Path('規格書.MD').read_text(encoding='utf-8')
          required = [
              'id="camera-overlay"',
              'navigator.mediaDevices?.getUserMedia',
              'function captureCameraPreview()',
              'function pickCornerByQuadrant(pt)',
              'isTouchCornerEvent(evt) ? pickCornerByQuadrant(point) : pickCorner(point)',
              '拍照後只匯入方框內的正方形影像',
              '手指從哪個象限開始拖曳，就移動對應角點',
          ]
          for token in required:
              if token not in html and token not in spec:
                  raise RuntimeError(f'Missing required token: {token}')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/makevcf-inline.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/makevcf-inline.js
          git diff --check

      - name: Commit generated changes
        run: |
          if git diff --quiet -- makevcf.html 規格書.MD; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html 規格書.MD
          git commit -m "加入手機拍照對齊框與四象限拖角"
          git push
