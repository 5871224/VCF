name: Refactor Generator Final Architecture

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/generator-final-architecture'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final architecture branch
        uses: actions/checkout@v6
        with:
          ref: agent/generator-final-architecture
          fetch-depth: 0

      - name: Check whether refactor is already applied
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[final architecture applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply final architecture refactor
        if: steps.guard.outputs.skip != 'true'
        run: python tools/refactor-generator-final-architecture.py

      - name: Check generator JavaScript syntax
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          for file in makevcf-generator-*.js; do
            node --check "$file"
          done

      - name: Run final architecture tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          node tests/generator-architecture-v2.test.js
          node tests/generator-registry-v2.test.js
          node tests/generator-search-policy-v2.test.js
          node tests/generator-finalize-v2.test.js
          node tests/generator-source-order.test.js
          node tests/generator-context.test.js
          node tests/generator-layout-replay.test.js
          node tools/apply-generator-replay-event-fixes.js
          node tools/apply-image-import-build-fixes.js
          git diff --check

      - name: Commit final architecture sources
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -f tools/refactor-generator-final-architecture.py
          rm -f tools/.generator-final-architecture-v2-payload-*
          rm -f tools/.generator-final-architecture-payload-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/refactor-generator-final-architecture.yml'
          git commit -m "完成題目產生器最終架構整理 [final architecture applied]"
          git push origin HEAD:agent/generator-final-architecture
