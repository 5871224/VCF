name: Add generator initial replay once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-generator-initial-replay-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record initial materials and add edge navigation
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          progress_path = Path('makevcf-generator-progress.js')
          progress = progress_path.read_text(encoding='utf-8')
          progress = replace_once(
              progress,
              '        .gen-replay-toolbar button { min-width: 82px; }',
              '        .gen-replay-toolbar button { min-width: 68px; }',
              'desktop replay button width',
          )
          progress = replace_once(
              progress,
              '          .gen-replay-toolbar button { min-width: 74px; padding-left: 10px; padding-right: 10px; }',
              '          .gen-replay-toolbar button { min-width: 62px; padding-left: 9px; padding-right: 9px; }',
              'mobile replay button width',
          )
          progress = replace_once(
              progress,
              '''        <div class="gen-replay-toolbar">
          <button id="gen-replay-prev" type="button">上一步</button>
          <span id="gen-replay-count" class="gen-replay-count">0 / 0</span>
          <button id="gen-replay-next" type="button">下一步</button>
        </div>''',
              '''        <div class="gen-replay-toolbar">
          <button id="gen-replay-first" type="button">最前</button>
          <button id="gen-replay-prev" type="button">上一步</button>
          <span id="gen-replay-count" class="gen-replay-count">0 / 0</span>
          <button id="gen-replay-next" type="button">下一步</button>
          <button id="gen-replay-last" type="button">最後</button>
        </div>''',
              'replay toolbar html',
          )
          progress = replace_once(
              progress,
              '''      replayElements = {
        panel,
        prev: panel.querySelector("#gen-replay-prev"),
        next: panel.querySelector("#gen-replay-next"),
        count: panel.querySelector("#gen-replay-count"),''',
              '''      replayElements = {
        panel,
        first: panel.querySelector("#gen-replay-first"),
        prev: panel.querySelector("#gen-replay-prev"),
        next: panel.querySelector("#gen-replay-next"),
        last: panel.querySelector("#gen-replay-last"),
        count: panel.querySelector("#gen-replay-count"),''',
              'replay element map',
          )
          progress = replace_once(
              progress,
              '''      replayElements.prev.addEventListener("click", () => showReplayStep(replayIndex - 1));
      replayElements.next.addEventListener("click", () => showReplayStep(replayIndex + 1));''',
              '''      replayElements.first.addEventListener("click", () => showReplayStep(0));
      replayElements.prev.addEventListener("click", () => showReplayStep(replayIndex - 1));
      replayElements.next.addEventListener("click", () => showReplayStep(replayIndex + 1));
      replayElements.last.addEventListener("click", () => showReplayStep(replaySteps.length - 1));''',
              'replay edge listeners',
          )
          progress = replace_once(
              progress,
              '''      elements.prev.disabled = replayIndex <= 0;
      elements.next.disabled = replayIndex >= replaySteps.length - 1;''',
              '''      elements.first.disabled = replayIndex <= 0;
      elements.prev.disabled = replayIndex <= 0;
      elements.next.disabled = replayIndex >= replaySteps.length - 1;
      elements.last.disabled = replayIndex >= replaySteps.length - 1;''',
              'replay edge disabled state',
          )
          progress = replace_once(
              progress,
              '''      return replaySteps.length - 1;
    }

    function updateReplayStep(index, updates) {''',
              '''      return replaySteps.length - 1;
    }

    window.genRecordGeneratorInitialBoard = function recordGeneratorInitialBoard(record = {}) {
      if (!replayRunning || !record.board) return -1;
      const kind = String(record.kind || "material");
      const label = kind === "liveThree"
        ? "活三"
        : kind === "deadFour"
          ? "死四"
          : kind === "forbidden"
            ? "禁手"
            : "初始材料";
      return addReplayStep({
        board: record.board,
        attacker: record.attacker || GEN_BLACK,
        scopeId: finalScopeId || ++replayScope,
        kind: `initial-${kind}`,
        title: record.title || `建立初始${label}`,
        status: "info",
        reason: record.reason || "已建立初始盤面，接著產生死四候選並驗證",
        detail: record.detail || "",
        forceNew: true,
      });
    };

    function updateReplayStep(index, updates) {''',
              'initial board replay hook',
          )
          progress_path.write_text(progress, encoding='utf-8')

          main_path = Path('makevcf-generator-main.js')
          main = main_path.read_text(encoding='utf-8')
          main = replace_once(
              main,
              '''    const baseSteps = base.materialType === "deadFour" ? 1 : 2;
    const baseLabel = base.materialType === "deadFour" ? "死四" : "活三";
    const candidates = genWeightedOrder(genEnumerateLayerCandidates(base, attacker, rules, options));''',
              '''    const baseSteps = base.materialType === "deadFour" ? 1 : 2;
    const baseLabel = base.materialType === "deadFour" ? "死四" : "活三";
    if (typeof window.genRecordGeneratorInitialBoard === "function") {
      window.genRecordGeneratorInitialBoard({
        board: base.board,
        attacker,
        kind: base.materialType,
        title: `建立初始${baseLabel}`,
        reason: `已選中${baseLabel}材料，接著嘗試加入第一層死四`,
        detail: [base.patternName, base.patternText].filter(Boolean).join("；"),
      });
    }
    const candidates = genWeightedOrder(genEnumerateLayerCandidates(base, attacker, rules, options));''',
              'normal initial material hook',
          )
          main_path.write_text(main, encoding='utf-8')

          summary_path = Path('makevcf-generator-summary.js')
          summary = summary_path.read_text(encoding='utf-8')
          summary = replace_once(
              summary,
              '''      if (!skeleton) {
        if (counters.baseRounds % 12 === 0) await genTick();
        continue;
      }

      const candidates = genWeightedOrder(buildWhiteCaptureCandidates(skeleton, options));''',
              '''      if (!skeleton) {
        if (counters.baseRounds % 12 === 0) await genTick();
        continue;
      }

      if (typeof window.genRecordGeneratorInitialBoard === "function") {
        window.genRecordGeneratorInitialBoard({
          board: skeleton.board,
          attacker: GEN_WHITE,
          kind: "forbidden",
          title: `建立禁手骨架（${skeleton.label}）`,
          reason: "黑棋禁手骨架已建立，接著套入白棋死四",
          detail: `A=${genName(skeleton.point)}；${skeleton.patternText}`,
        });
      }

      const candidates = genWeightedOrder(buildWhiteCaptureCandidates(skeleton, options));''',
              'forbidden skeleton replay hook',
          )
          summary_path.write_text(summary, encoding='utf-8')

          spec_path = Path('題目產生器逐步回放規格.MD')
          spec = spec_path.read_text(encoding='utf-8')
          spec = replace_once(
              spec,
              '''1. 每一個送入驗證的死四候選盤面。
2. 自動封鎖較短 VCF 時，每補上一顆守方棋後的盤面。
3. 「只保留目標 VCF」逐顆補守後的盤面。
4. 補齊黑白子數時，每補上一顆棋後的盤面。
5. 最終成功題目盤面。''',
              '''1. 每次選中的初始活三或初始死四盤面；即使尚未產生可驗證候選也須保留。
2. 白方抓禁手題每次建立完成的黑棋禁手骨架盤面，須在套入白棋死四前保存，並標示長連、四四或三三及禁點 A。
3. 每一個送入驗證的死四候選盤面。
4. 自動封鎖較短 VCF 時，每補上一顆守方棋後的盤面。
5. 「只保留目標 VCF」逐顆補守後的盤面。
6. 補齊黑白子數時，每補上一顆棋後的盤面。
7. 最終成功題目盤面。''',
              'spec record scope',
          )
          spec = replace_once(
              spec,
              '- 步驟類型：死四、補守、封鎖其他 VCF、補齊子數或最終題目。',
              '- 步驟類型：初始活三、初始死四、禁手骨架、死四候選、補守、封鎖其他 VCF、補齊子數或最終題目。',
              'spec step types',
          )
          spec = replace_once(
              spec,
              '''- 面板提供「上一步」與「下一步」。
- 顯示目前序號與總步數。
- 第一筆時停用「上一步」，最後一筆時停用「下一步」。''',
              '''- 面板提供「最前」、「上一步」、「下一步」與「最後」。
- 「最前」直接切換到第一筆初始盤面；「最後」直接切換到最後一筆盤面。
- 顯示目前序號與總步數。
- 第一筆時停用「最前」與「上一步」，最後一筆時停用「下一步」與「最後」。''',
              'spec replay controls',
          )
          spec = replace_once(
              spec,
              '''3. 成功後可從第一步逐步切換到最終盤面。
4. 每個死四候選都有獨立紀錄。
5. 每次逐顆補子後都有盤面紀錄。
6. 每步均顯示驗證狀態；未通過時顯示原因。
7. 新一輪產生會清除上一輪紀錄。
8. 手機版可操作。''',
              '''3. 成功後可從最初盤面逐步切換到最終盤面，並可用「最前」與「最後」直接跳轉。
4. 每次選中的初始活三、初始死四都有獨立紀錄。
5. 每次建立的長連、四四或三三禁手骨架都在白死四套入前留下紀錄。
6. 每個死四候選都有獨立紀錄。
7. 每次逐顆補子後都有盤面紀錄。
8. 每步均顯示驗證狀態；未通過時顯示原因。
9. 新一輪產生會清除上一輪紀錄。
10. 手機版可操作。''',
              'spec acceptance',
          )
          spec_path.write_text(spec, encoding='utf-8')

          Path('.github/workflows/add-generator-initial-replay-once.yml').unlink()
          PY

      - name: Verify generator replay changes
        shell: bash
        run: |
          set -euxo pipefail
          node --check makevcf-generator-progress.js
          node --check makevcf-generator-main.js
          node --check makevcf-generator-summary.js
          python3 <<'PY'
          from pathlib import Path
          progress = Path('makevcf-generator-progress.js').read_text(encoding='utf-8')
          main = Path('makevcf-generator-main.js').read_text(encoding='utf-8')
          summary = Path('makevcf-generator-summary.js').read_text(encoding='utf-8')
          spec = Path('題目產生器逐步回放規格.MD').read_text(encoding='utf-8')
          required = [
              ('progress first button', 'id="gen-replay-first"' in progress),
              ('progress last button', 'id="gen-replay-last"' in progress),
              ('initial replay callback', 'window.genRecordGeneratorInitialBoard' in progress),
              ('normal material callback', '建立初始${baseLabel}' in main),
              ('forbidden skeleton callback', '建立禁手骨架（${skeleton.label}）' in summary),
              ('spec initial live three', '初始活三' in spec),
              ('spec edge controls', '「最前」、「上一步」、「下一步」與「最後」' in spec),
          ]
          missing = [name for name, ok in required if not ok]
          if missing:
              raise SystemExit('missing replay changes: ' + ', '.join(missing))
          PY
          git diff --check

      - name: Commit directly to main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '題目產生器從初始材料開始回放'
          git push origin HEAD:main
