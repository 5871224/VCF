name: One-time pure engine stats migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pure-engine-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use pure engine timing for calculation statistics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, label, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{label}: expected at least {minimum}, found {count} in {path}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              return count

          # Shared formatter/combiner. Final result statistics must be based only on
          # engine-returned elapsedMs/nodeCount/nodesPerSecond, never UI wall time.
          replace_once(
              'makevcf.html',
              '''function elapsed(t0) { return `${((performance.now() - t0) / 1000).toFixed(4)} 秒`; }
          function fmtNodes(n) { return `${formatSearchInteger(n)} 節點`; }
          function fmtRate(nodes, t0) {
            const sec = (performance.now() - t0) / 1000;
            const rate = sec > 0 ? Number(nodes || 0) / sec : 0;
            return `${formatSearchInteger(rate)} 節點/秒`;
          }
          ''',
              '''function elapsed(t0) { return `${((performance.now() - t0) / 1000).toFixed(4)} 秒`; }
          function fmtNodes(n) { return `${formatSearchInteger(n)} 節點`; }
          function normalizePureEngineStats(info = {}) {
            const nodeCount = Math.max(0, Number(info?.nodeCount || 0));
            const elapsedMs = Math.max(0, Number(info?.elapsedMs || 0));
            const reportedRate = Number(info?.nodesPerSecond);
            const nodesPerSecond = Number.isFinite(reportedRate) && reportedRate >= 0
              ? reportedRate
              : (elapsedMs > 0 ? nodeCount * 1000 / elapsedMs : 0);
            return { nodeCount, elapsedMs, nodesPerSecond };
          }
          function combinePureEngineStats(...items) {
            const stats = items.filter(Boolean).map(normalizePureEngineStats);
            const nodeCount = stats.reduce((sum, item) => sum + item.nodeCount, 0);
            const elapsedMs = stats.reduce((sum, item) => sum + item.elapsedMs, 0);
            return {
              nodeCount,
              elapsedMs,
              nodesPerSecond: elapsedMs > 0 ? nodeCount * 1000 / elapsedMs : 0,
            };
          }
          function formatPureEngineStats(info = {}) {
            const stats = normalizePureEngineStats(info);
            return `${(stats.elapsedMs / 1000).toFixed(4)} 秒，${fmtNodes(stats.nodeCount)}，${formatSearchInteger(stats.nodesPerSecond)} 節點/秒`;
          }
          window.vcfNormalizePureEngineStats = normalizePureEngineStats;
          window.vcfCombinePureEngineStats = combinePureEngineStats;
          window.vcfFormatPureEngineStats = formatPureEngineStats;
          function fmtRate(nodes, t0) {
            const sec = (performance.now() - t0) / 1000;
            const rate = sec > 0 ? Number(nodes || 0) / sec : 0;
            return `${formatSearchInteger(rate)} 節點/秒`;
          }
          ''',
              'shared pure engine stats helpers',
          )

          # Legacy/basic handlers in makevcf.html: keep progress wall time if needed,
          # but all completed result statistics use the engine-returned timing.
          replace_all(
              'makevcf.html',
              '${elapsed(t0)}，${fmtNodes(info.nodeCount)}，${fmtRate(info.nodeCount, t0)}',
              '${formatPureEngineStats(info)}',
              'legacy info pure stats',
              minimum=3,
          )
          replace_all(
              'makevcf.html',
              '${elapsed(t0)}，${fmtNodes(vcfResult.nodeCount)}，${fmtRate(vcfResult.nodeCount, t0)}',
              '${formatPureEngineStats(vcfResult)}',
              'vcf result pure stats',
              minimum=2,
          )
          replace_once(
              'makevcf.html',
              'setStatus(`${cName} VCF 防守點：${points.length} 個（${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}）`);',
              'setStatus(`${cName} VCF 防守點：${points.length} 個（${formatPureEngineStats(result)}）`);',
              'single defense found pure stats',
          )
          replace_once(
              'makevcf.html',
              'window._clearAnalysis(); setStatus(`${cName} 未找到 VCF 防守點（${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}）`);',
              'window._clearAnalysis(); setStatus(`${cName} 未找到 VCF 防守點（${formatPureEngineStats(result)}）`);',
              'single defense empty pure stats',
          )
          replace_once(
              'makevcf.html',
              '''      const totalNodes = Number(vcfResult.nodeCount || 0) + blockNodeCount;
                setStatus(`${cName} 未找到 VCF 防守候選點（${elapsed(t0)}，${fmtNodes(totalNodes)}，${fmtRate(totalNodes, t0)}）`);
          ''',
              '''      const pureStats = combinePureEngineStats(vcfResult, blockResult);
                setStatus(`${cName} 未找到 VCF 防守候選點（${formatPureEngineStats(pureStats)}）`);
          ''',
              'all defense no candidates pure stats',
          )
          replace_once(
              'makevcf.html',
              '''    const totalNodes = Number(vcfResult.nodeCount || 0) + blockNodeCount + Number(data.nodeCount || 0);
          
              window._clearAnalysis();
              if (confirmed.length) {
                window._showAnalysisTriangles(confirmed, "#4488ff");
                setStatus(`${cName} 全部VCF防守：${confirmed.length} 個有效防守點（${elapsed(t0)}，${fmtNodes(totalNodes)}，${fmtRate(totalNodes, t0)}）`);
              } else {
                setStatus(`${cName} 無有效防守點（${elapsed(t0)}，${fmtNodes(totalNodes)}，${fmtRate(totalNodes, t0)}）`);
              }
          ''',
              '''    const pureStats = combinePureEngineStats(vcfResult, blockResult, data);
          
              window._clearAnalysis();
              if (confirmed.length) {
                window._showAnalysisTriangles(confirmed, "#4488ff");
                setStatus(`${cName} 全部VCF防守：${confirmed.length} 個有效防守點（${formatPureEngineStats(pureStats)}）`);
              } else {
                setStatus(`${cName} 無有效防守點（${formatPureEngineStats(pureStats)}）`);
              }
          ''',
              'all defense aggregate pure stats',
          )
          replace_all(
              'makevcf.html',
              '${elapsed(t1)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t1)}',
              '${formatPureEngineStats(combinePureEngineStats(vcfResult, data))}',
              'vct aggregate pure stats',
              minimum=2,
          )

          # Dashboard active handlers.
          replace_all(
              'rapfi/rapfi-bitboard-dashboard.js',
              '${elapsed(t0)}，${fmtNodes(info.nodeCount)}，${fmtRate(info.nodeCount, t0)}',
              '${window.vcfFormatPureEngineStats(info)}',
              'dashboard single pure stats',
              minimum=1,
          )
          replace_all(
              'rapfi/rapfi-bitboard-dashboard.js',
              '${elapsed(t0)}，${fmtNodes(info?.nodeCount || 0)}，${fmtRate(info?.nodeCount || 0, t0)}',
              '${window.vcfFormatPureEngineStats(info)}',
              'dashboard multi pure stats',
              minimum=3,
          )
          replace_all(
              'rapfi/rapfi-bitboard-dashboard.js',
              '${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}',
              '${window.vcfFormatPureEngineStats(data)}',
              'dashboard add pure stats',
              minimum=2,
          )

          # Shortest-add parallel workers: aggregate engine elapsed time per worker,
          # then use the slowest worker's accumulated pure calculation time.
          replace_once(
              'rapfi/rapfi-bitboard-dashboard.js',
              '''  const startedAt = performance.now();
            const results = await Promise.all(workers.map(async (worker, workerIndex) => {
              const items = [];
              let nodeCount = 0;
              let aborted = false;
              let unprovenCount = 0;
          ''',
              '''  const results = await Promise.all(workers.map(async (worker, workerIndex) => {
              const items = [];
              let nodeCount = 0;
              let elapsedMs = 0;
              let aborted = false;
              let unprovenCount = 0;
          ''',
              'shortest add worker timing start',
          )
          replace_once(
              'rapfi/rapfi-bitboard-dashboard.js',
              '''      nodeCount += Number(info?.nodeCount || 0);
                aborted = aborted || Boolean(info?.aborted);
          ''',
              '''      nodeCount += Number(info?.nodeCount || 0);
                elapsedMs += Number(info?.elapsedMs || 0);
                aborted = aborted || Boolean(info?.aborted);
          ''',
              'shortest add worker timing accumulation',
          )
          replace_once(
              'rapfi/rapfi-bitboard-dashboard.js',
              '    return { items, nodeCount, aborted, unprovenCount };',
              '    return { items, nodeCount, elapsedMs, aborted, unprovenCount };',
              'shortest add worker timing return',
          )
          replace_once(
              'rapfi/rapfi-bitboard-dashboard.js',
              '    elapsedMs: performance.now() - startedAt,',
              '    elapsedMs: Math.max(0, ...results.map(result => Number(result.elapsedMs || 0))),',
              'shortest add pure elapsed aggregation',
          )

          # Shortest VCF keeps wall clock only for live progress. Final stats use worker data.
          replace_once(
              'rapfi/vcf-shortest-vcf-ui.js',
              '''      const elapsedSeconds = (performance.now() - started) / 1000;
                const nodeCount = Number(info?.nodeCount || 0);
                const rate = elapsedSeconds > 0 ? nodeCount / elapsedSeconds : 0;
                const stats = `${elapsedSeconds.toFixed(4)} 秒，${formatInteger(nodeCount)} 節點，${formatInteger(rate)} 節點/秒`;
          ''',
              '''      const stats = global.vcfFormatPureEngineStats?.(info)
                || `${(Number(info?.elapsedMs || 0) / 1000).toFixed(4)} 秒，${formatInteger(info?.nodeCount || 0)} 節點，${formatInteger(info?.nodesPerSecond || 0)} 節點/秒`;
          ''',
              'shortest final pure stats',
          )

          # Parallel pool API should itself return a standardized pure throughput.
          replace_once(
              'rapfi/vcf-bitboard-main.js',
              '''      return {
                items,
                nodeCount: results.reduce((sum, result) => sum + (result.nodeCount || 0), 0),
                elapsedMs: Math.max(0, ...results.map(result => result.elapsedMs || 0)),
                aborted: results.some(result => result.aborted),
              };
          ''',
              '''      const nodeCount = results.reduce((sum, result) => sum + (result.nodeCount || 0), 0);
              const elapsedMs = Math.max(0, ...results.map(result => result.elapsedMs || 0));
              return {
                items,
                nodeCount,
                elapsedMs,
                nodesPerSecond: elapsedMs > 0 ? nodeCount * 1000 / elapsedMs : 0,
                aborted: results.some(result => result.aborted),
              };
          ''',
              'pool pure throughput return',
          )

          # Browser cache busts.
          replace_once(
              'makevcf.html',
              'rapfi/rapfi-bitboard-dashboard.js?v=20260913-calc-display-v2',
              'rapfi/rapfi-bitboard-dashboard.js?v=20260914-pure-engine-stats',
              'dashboard cache version',
          )
          replace_once(
              'makevcf.html',
              'rapfi/vcf-shortest-vcf-ui.js?v=20260913-defense-preserve',
              'rapfi/vcf-shortest-vcf-ui.js?v=20260914-pure-engine-stats',
              'shortest cache version',
          )

          # Product spec.
          spec = Path('規格書.MD')
          text = spec.read_text(encoding='utf-8')
          anchor = '- 搜尋與防守計算完成後，狀態列必須保留耗時、節點數與節點/秒；「展示計算」的被動結果同步不得覆蓋這份完成提示。只有使用者手動切換計算組別或逐手回放時，才可改寫為展示位置。\n'
          addition = ('- 完成提示中的耗時與節點/秒必須使用 Worker／WASM 回傳的純計算統計；不得把清除標記、SVG 繪製、狀態列更新或其他前端後處理時間算入。多 Worker 以總節點除以最慢 Worker 的純計算時間；多階段防守／VCT 則加總各引擎階段的節點與純計算時間後計算整體速度。\n')
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('spec stats anchor missing')
              spec.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          # Architecture tests: current cache versions and pure-stat contracts.
          test = Path('tests/workbench-architecture.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace('rapfi/rapfi-bitboard-dashboard.js?v=20260913-calc-display-v2', 'rapfi/rapfi-bitboard-dashboard.js?v=20260914-pure-engine-stats')
          anchor = 'console.log("Workbench and repository architecture checks passed");\n'
          addition = '''const pureStatsHtml = read("makevcf.html");
          const pureStatsDashboard = read("rapfi/rapfi-bitboard-dashboard.js");
          const pureStatsShortest = read("rapfi/vcf-shortest-vcf-ui.js");
          const pureStatsMain = read("rapfi/vcf-bitboard-main.js");
          for (const token of [
            "function normalizePureEngineStats(info = {})",
            "function combinePureEngineStats(...items)",
            "function formatPureEngineStats(info = {})",
            "window.vcfFormatPureEngineStats = formatPureEngineStats",
          ]) if (!pureStatsHtml.includes(token)) throw new Error(`pure engine stats helper missing: ${token}`);
          if (!pureStatsDashboard.includes("window.vcfFormatPureEngineStats(info)")
              || !pureStatsDashboard.includes("window.vcfFormatPureEngineStats(data)")
              || !pureStatsDashboard.includes("elapsedMs += Number(info?.elapsedMs || 0)")
              || !pureStatsDashboard.includes("Math.max(0, ...results.map(result => Number(result.elapsedMs || 0)))")) {
            throw new Error("dashboard final statistics must use pure engine timing");
          }
          if (!pureStatsShortest.includes("global.vcfFormatPureEngineStats?.(info)")) {
            throw new Error("shortest VCF final statistics must use pure engine timing");
          }
          if (!pureStatsMain.includes("nodesPerSecond: elapsedMs > 0 ? nodeCount * 1000 / elapsedMs : 0")) {
            throw new Error("parallel engine result must return pure throughput");
          }
          if (!pureStatsHtml.includes('rapfi/vcf-shortest-vcf-ui.js?v=20260914-pure-engine-stats')) {
            throw new Error("pure engine stats scripts must be cache-busted");
          }
          '''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('architecture test anchor missing')
              test.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check rapfi/vcf-bitboard-main.js
          node --check rapfi/rapfi-bitboard-dashboard.js
          node --check rapfi/vcf-shortest-vcf-ui.js
          node tests/workbench-architecture.test.js
          python - <<'PY'
          from pathlib import Path
          html = Path('makevcf.html').read_text(encoding='utf-8')
          dashboard = Path('rapfi/rapfi-bitboard-dashboard.js').read_text(encoding='utf-8')
          shortest = Path('rapfi/vcf-shortest-vcf-ui.js').read_text(encoding='utf-8')
          # Final result code should not derive speed from UI wall-clock timers.
          bad = []
          for name, text in [('makevcf.html', html), ('dashboard', dashboard)]:
              for line in text.splitlines():
                  if 'setStatus(' in line and 'fmtRate(' in line:
                      bad.append(f'{name}: {line.strip()}')
          if 'const elapsedSeconds = (performance.now() - started) / 1000;' in shortest:
              raise SystemExit('shortest final result still uses wall-clock elapsed time')
          if bad:
              raise SystemExit('final status still uses wall-clock fmtRate:\n' + '\n'.join(bad))
          PY
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html rapfi/vcf-bitboard-main.js rapfi/rapfi-bitboard-dashboard.js rapfi/vcf-shortest-vcf-ui.js tests/workbench-architecture.test.js 規格書.MD
          git commit -m "Use pure engine timing for calculation speed"
          git push
