name: Finalize search stats display repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-search-stats-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update stale cache contracts and apply repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          test = Path('tests/workbench-architecture.test.js')
          text = test.read_text(encoding='utf-8')
          old_token = 'makevcf-layout.js?v=20260913-calc-display-v2'
          if text.count(old_token) < 2:
              raise SystemExit('expected stale layout cache contracts not found')
          text = text.replace(old_token, 'makevcf-layout.js?v=20260913-search-stats')
          test.write_text(text, encoding='utf-8')

          workflow_lines = Path('.github/workflows/apply-search-stats-display.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow_lines) if line.strip() == 'from pathlib import Path')
          end = next(i for i in range(start + 1, len(workflow_lines)) if workflow_lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(workflow_lines[start:end]))
          exec(compile(code, 'embedded-search-stats-repair.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate
        run: |
          node --check makevcf-layout.js
          node --check rapfi/vcf-bitboard-main.js
          node tests/workbench-architecture.test.js
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf-layout.js rapfi/vcf-bitboard-main.js makevcf.html tests/workbench-architecture.test.js 規格書.MD
          git commit -m "Restore calculation node and speed status"
          git push
