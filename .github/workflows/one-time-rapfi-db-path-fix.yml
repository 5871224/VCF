name: One-time Rapfi DB root-path compatibility fix

on:
  push:
    paths:
      - .github/workflows/one-time-rapfi-db-path-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch YXDB export to include path from empty board
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('rapfi/rapfi-workbench-header.js')
          s = path.read_text(encoding='utf-8')
          marker = '  function collectYXDBPositions(rootBoard, routes, attacker, rule) {'
          if marker not in s:
              raise SystemExit('collectYXDBPositions marker not found')
          if '  function addYXDBSetupPath(rootBoard, add) {' not in s:
              helper = '''  // Rapfi YXDB is a position DAG. A portable branch database must also
          // contain the path from the empty board to the selected root position, matching
          // Rapfi splitDatabase()/copyDatabasePathToRoot() semantics.
          function addYXDBSetupPath(rootBoard, add) {
            const canonical = canonicalPosition(rootBoard);
            const setupBoard = new Uint8Array(BOARD_CELLS);
            add(setupBoard); // empty-board root

            const count = Math.max(canonical.black.length, canonical.white.length);
            for (let i = 0; i < count; i++) {
              if (i < canonical.black.length) {
                const [x, y] = canonical.black[i];
                setupBoard[y * BOARD_SIZE + x] = BLACK;
                add(setupBoard);
              }
              if (i < canonical.white.length) {
                const [x, y] = canonical.white[i];
                setupBoard[y * BOARD_SIZE + x] = WHITE;
                add(setupBoard);
              }
            }
          }

          '''
              s = s.replace(marker, helper + marker, 1)
          if '    addYXDBSetupPath(rootBoard, add);' not in s:
              old = '    add(rootBoard);'
              if old not in s:
                  raise SystemExit('root add marker not found')
              s = s.replace(old, '    addYXDBSetupPath(rootBoard, add);', 1)
          path.write_text(s, encoding='utf-8')

          test = Path('tests/workbench-architecture.test.js')
          t = test.read_text(encoding='utf-8')
          t = t.replace('if (yxdb.recordCount !== 1) throw new Error("YXDB root record count is invalid");',
                        'if (yxdb.recordCount !== 3) throw new Error("YXDB must include empty→setup root path");')
          t = t.replace('if (Array.from(yxdbPayload.slice(0, 4)).join(",") !== "2,0,0,0") {',
                        'if (Array.from(yxdbPayload.slice(0, 4)).join(",") !== "4,0,0,0") {')
          t = t.replace('if (routedYXDB.recordCount !== 4) throw new Error("YXDB route prefixes were not persisted");',
                        'if (routedYXDB.recordCount !== 6) throw new Error("YXDB setup path + route prefixes were not persisted");')
          token = '  "createYXDB",\n'
          if token in t and '  "addYXDBSetupPath",\n' not in t:
              t = t.replace(token, token + '  "addYXDBSetupPath",\n', 1)
          test.write_text(t, encoding='utf-8')
          PY

          node --check rapfi/rapfi-workbench-header.js
          npm run test:architecture
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapfi/rapfi-workbench-header.js tests/workbench-architecture.test.js
          git commit -m "修正 YXDB 匯出補齊 Rapfi 根路徑"
          git push origin HEAD:main
