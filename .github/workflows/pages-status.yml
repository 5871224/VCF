name: Report Pages Deployment Status

on:
  workflow_run:
    workflows: ["Deploy VCF to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Write deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "deployment-status";
            const path = "status.json";
            const run = context.payload.workflow_run;
            const payload = {
              status: run.conclusion,
              run_id: run.id,
              run_number: run.run_number,
              head_sha: run.head_sha,
              event: run.event,
              html_url: run.html_url,
              created_at: run.created_at,
              updated_at: run.updated_at,
              reported_at: new Date().toISOString(),
            };
            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: branch,
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: current.data.sha,
              message: `Pages deployment ${run.conclusion}: ${run.id}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + "\n").toString("base64"),
            });
