name: Finalize pure engine stats migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-pure-engine-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply migration structurally
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Apply all migration edits up to the known pool-return mismatch.
          lines = Path('.github/workflows/apply-pure-engine-stats.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'from pathlib import Path')
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start:end]))
          try:
              exec(compile(code, 'embedded-pure-engine-stats.py', 'exec'), {'__name__': '__main__'})
              raise SystemExit('embedded migration unexpectedly completed; finalize workflow is stale')
          except SystemExit as exc:
              if not str(exc).startswith('pool pure throughput return:'):
                  raise

          # Structurally replace the unique pool aggregate return block.
          main = Path('rapfi/vcf-bitboard-main.js')
          text = main.read_text(encoding='utf-8')
          needle = '        nodeCount: results.reduce((sum, result) => sum + (result.nodeCount || 0), 0),'
          idx = text.find(needle)
          if idx < 0:
              raise SystemExit('pool nodeCount aggregate line missing')
          start_idx = text.rfind('      return {', 0, idx)
          end_idx = text.find('      };', idx)
          if start_idx < 0 or end_idx < 0:
              raise SystemExit('pool return block boundaries missing')
          end_idx += len('      };')
          replacement = '''      const nodeCount = results.reduce((sum, result) => sum + (result.nodeCount || 0), 0);
          const elapsedMs = Math.max(0, ...results.map(result => result.elapsedMs || 0));
          return {
            items,
            nodeCount,
            elapsedMs,
            nodesPerSecond: elapsedMs > 0 ? nodeCount * 1000 / elapsedMs : 0,
            aborted: results.some(result => result.aborted),
          };'''
          main.write_text(text[:start_idx] + replacement + text[end_idx:], encoding='utf-8')

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('makevcf.html',
              'rapfi/rapfi-bitboard-dashboard.js?v=20260913-calc-display-v2',
              'rapfi/rapfi-bitboard-dashboard.js?v=20260914-pure-engine-stats',
              'dashboard cache version')
          replace_once('makevcf.html',
              'rapfi/vcf-shortest-vcf-ui.js?v=20260913-defense-preserve',
              'rapfi/vcf-shortest-vcf-ui.js?v=20260914-pure-engine-stats',
              'shortest cache version')

          spec = Path('規格書.MD')
          text = spec.read_text(encoding='utf-8')
          anchor = '- 搜尋與防守計算完成後，狀態列必須保留耗時、節點數與節點/秒；「展示計算」的被動結果同步不得覆蓋這份完成提示。只有使用者手動切換計算組別或逐手回放時，才可改寫為展示位置。\n'
          addition = '- 完成提示中的耗時與節點/秒必須使用 Worker／WASM 回傳的純計算統計；不得把清除標記、SVG 繪製、狀態列更新或其他前端後處理時間算入。多 Worker 以總節點除以最慢 Worker 的純計算時間；多階段防守／VCT 則加總各引擎階段的節點與純計算時間後計算整體速度。\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('spec stats anchor missing')
              spec.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          test = Path('tests/workbench-architecture.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace('rapfi/rapfi-bitboard-dashboard.js?v=20260913-calc-display-v2', 'rapfi/rapfi-bitboard-dashboard.js?v=20260914-pure-engine-stats')
          anchor = 'console.log("Workbench and repository architecture checks passed");\n'
          addition = '''const pureStatsHtml = read("makevcf.html");
          const pureStatsDashboard = read("rapfi/rapfi-bitboard-dashboard.js");
          const pureStatsShortest = read("rapfi/vcf-shortest-vcf-ui.js");
          const pureStatsMain = read("rapfi/vcf-bitboard-main.js");
          for (const token of [
            "function normalizePureEngineStats(info = {})",
            "function combinePureEngineStats(...items)",
            "function formatPureEngineStats(info = {})",
            "window.vcfFormatPureEngineStats = formatPureEngineStats",
          ]) if (!pureStatsHtml.includes(token)) throw new Error(`pure engine stats helper missing: ${token}`);
          if (!pureStatsDashboard.includes("window.vcfFormatPureEngineStats(info)")
              || !pureStatsDashboard.includes("window.vcfFormatPureEngineStats(data)")
              || !pureStatsDashboard.includes("elapsedMs += Number(info?.elapsedMs || 0)")
              || !pureStatsDashboard.includes("Math.max(0, ...results.map(result => Number(result.elapsedMs || 0)))")) {
            throw new Error("dashboard final statistics must use pure engine timing");
          }
          if (!pureStatsShortest.includes("global.vcfFormatPureEngineStats?.(info)")) {
            throw new Error("shortest VCF final statistics must use pure engine timing");
          }
          if (!pureStatsMain.includes("nodesPerSecond: elapsedMs > 0 ? nodeCount * 1000 / elapsedMs : 0")) {
            throw new Error("parallel engine result must return pure throughput");
          }
          if (!pureStatsHtml.includes('rapfi/vcf-shortest-vcf-ui.js?v=20260914-pure-engine-stats')) {
            throw new Error("pure engine stats scripts must be cache-busted");
          }
          '''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('architecture test anchor missing')
              text = text.replace(anchor, addition + anchor, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check rapfi/vcf-bitboard-main.js
          node --check rapfi/rapfi-bitboard-dashboard.js
          node --check rapfi/vcf-shortest-vcf-ui.js
          node tests/workbench-architecture.test.js
          python - <<'PY'
          from pathlib import Path
          html = Path('makevcf.html').read_text(encoding='utf-8')
          dashboard = Path('rapfi/rapfi-bitboard-dashboard.js').read_text(encoding='utf-8')
          shortest = Path('rapfi/vcf-shortest-vcf-ui.js').read_text(encoding='utf-8')
          bad = []
          for name, text in [('makevcf.html', html), ('dashboard', dashboard)]:
              for line in text.splitlines():
                  if 'setStatus(' in line and 'fmtRate(' in line:
                      bad.append(f'{name}: {line.strip()}')
          if 'const elapsedSeconds = (performance.now() - started) / 1000;' in shortest:
              raise SystemExit('shortest final result still uses wall-clock elapsed time')
          if bad:
              raise SystemExit('final status still uses wall-clock fmtRate:\n' + '\n'.join(bad))
          PY
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html rapfi/vcf-bitboard-main.js rapfi/rapfi-bitboard-dashboard.js rapfi/vcf-shortest-vcf-ui.js tests/workbench-architecture.test.js 規格書.MD
          git commit -m "Use pure engine timing for calculation speed"
          git push
