name: VCF Generator CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'makevcf-generator-*.js'
      - 'makevcf-mobile.js'
      - 'makevcf-optimized-search-v2.js'
      - 'eval/Evaluator.js'
      - 'rapfi/vcf-bitboard-generator-compat.js'
      - 'rapfi/vcf-bitboard-worker.js'
      - 'tests/generator-*.test.js'
      - 'package.json'
      - 'README.md'
      - 'AGENTS.md'
      - '規格書.MD'
      - '禁手判斷規格.MD'
      - '.github/workflows/vcf-generator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check generator JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          for file in \
            makevcf-generator-*.js \
            makevcf-mobile.js \
            makevcf-optimized-search-v2.js \
            eval/Evaluator.js \
            rapfi/vcf-bitboard-generator-compat.js \
            rapfi/vcf-bitboard-worker.js; do
            node --check "$file"
          done

      - name: Test generator architecture and behavior
        shell: bash
        run: |
          set -euxo pipefail
          node tests/generator-architecture-v2.test.js
          node tests/generator-source-order.test.js
          npm run test:generator
