name: One-time defense auto-clear exception

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-defense-auto-clear-exception.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply exception
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('rapfi/vcf-shortest-vcf-ui.js')
          js = js_path.read_text(encoding='utf-8')
          old_comment = '// 單一路線防守（btn-block-vcf）刻意排除，因為它需要目前 VCF 路線作為輸入。'
          new_comment = '// 單一路線防守與全部路線防守刻意排除，因為防守計算需要保留目前標記／路線。'
          if old_comment not in js:
              raise SystemExit('expected auto-clear comment not found')
          js = js.replace(old_comment, new_comment, 1)
          old_item = '      "btn-block-vcf-all",\n'
          if old_item not in js:
              raise SystemExit('btn-block-vcf-all is already absent or source changed')
          js = js.replace(old_item, '', 1)
          js_path.write_text(js, encoding='utf-8')

          html_path = Path('makevcf.html')
          html = html_path.read_text(encoding='utf-8')
          old = 'rapfi/vcf-shortest-vcf-ui.js?v=20260913-auto-clear-preflight'
          new = 'rapfi/vcf-shortest-vcf-ui.js?v=20260913-defense-preserve'
          if old not in html:
              raise SystemExit('expected cache version not found')
          html = html.replace(old, new, 1)
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check rapfi/vcf-shortest-vcf-ui.js
          node tests/workbench-architecture.test.js
          python - <<'PY'
          from pathlib import Path
          js = Path('rapfi/vcf-shortest-vcf-ui.js').read_text(encoding='utf-8')
          policy = js[js.index('const AUTO_CLEAR_CALCULATION_IDS'):js.index('document.addEventListener("click"')]
          assert '"btn-block-vcf"' not in policy
          assert '"btn-block-vcf-all"' not in policy
          for token in ['"btn-black"','"btn-white"','"btn-multi-vcf"','"btn-shortest-vcf"','"btn-level3"','"btn-add-black"','"btn-add-white"']:
              assert token in policy, token
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapfi/vcf-shortest-vcf-ui.js makevcf.html
          git diff --cached --check
          git commit -m "Preserve markers for all-route defense"
          git push
