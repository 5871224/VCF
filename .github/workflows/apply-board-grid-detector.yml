name: Apply board grid detector

on:
  push:
    branches: [main]
    paths:
      - 'scripts/board-grid-patch.part1'
      - 'scripts/board-grid-patch.part2'
      - 'scripts/board-grid-patch.part3'
      - '.github/workflows/apply-board-grid-detector.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble and apply patch
        run: |
          cat scripts/board-grid-patch.part1 scripts/board-grid-patch.part2 scripts/board-grid-patch.part3 > /tmp/apply-board-grid-detector.js
          node --check /tmp/apply-board-grid-detector.js
          node /tmp/apply-board-grid-detector.js

      - name: Validate files
        run: |
          python - <<'PY'
          import re
          text = open('makevcf.html', encoding='utf-8').read()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          open('/tmp/makevcf-inline.js', 'w', encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/makevcf-inline.js
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html README.md 規格書.MD
          if ! git diff --cached --quiet; then
            git commit -m "改進圖片匯入15路棋盤定位"
            git push
          fi
