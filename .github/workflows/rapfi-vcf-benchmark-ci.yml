name: Standalone Rapfi VCF benchmark CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'rapfi/vcf-rapfi-vcf-standalone.cpp'
      - 'rapfi/vcf-rapfi-vcf-benchmark.js'
      - 'rapfi/vcf-rapfi-vcf-worker.js'
      - 'index.html'
      - 'tests/workbench-architecture.test.js'
      - '.github/workflows/rapfi-vcf-benchmark-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RAPFI_REF: 3aedf3a2ab0ab710a9f3d00e57d5287ceb864894

jobs:
  native-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent JavaScript and architecture
        run: |
          node --check rapfi/vcf-rapfi-vcf-benchmark.js
          node --check rapfi/vcf-rapfi-vcf-worker.js
          npm run test:architecture
      - name: Fetch pinned upstream Rapfi
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/dhbloo/rapfi.git .build/rapfi
          git -C .build/rapfi fetch --depth 1 origin "$RAPFI_REF"
          git -C .build/rapfi checkout --detach "$RAPFI_REF"
      - name: Compile and run separate native Rapfi VCF smoke test
        run: |
          set -euxo pipefail
          rapfi_root="$PWD/.build/rapfi/Rapfi"
          sources=(
            rapfi/vcf-rapfi-vcf-standalone.cpp
            "$rapfi_root/core/hash.cpp"
            "$rapfi_root/core/utils.cpp"
            "$rapfi_root/game/pattern.cpp"
            "$rapfi_root/game/board.cpp"
            "$rapfi_root/game/movegen.cpp"
            "$rapfi_root/external/lz4/src/xxhash.c"
          )
          g++ "${sources[@]}" -I"$rapfi_root" -I"$rapfi_root/external/lz4/include" -O2 -std=c++17 \
            -ffunction-sections -fdata-sections -DVCF_RAPFI_VCF_STANDALONE_TEST_MAIN \
            -Wl,--gc-sections -o /tmp/rapfi-vcf-standalone-test
          /tmp/rapfi-vcf-standalone-test

      - name: Benchmark Bitboard and Rapfi on identical positions and eight symmetries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path("rapfi/vcf-rapfi-vcf-standalone.cpp").read_text()
          replacements=[
              ("    uint64_t nodes = 0;", "    uint64_t nodes = 0;\n    uint64_t attackNodes = 0;"),
              ("        nodes++;\n        maxPlyVisited", "        nodes++;\n        if (ply & 1) attackNodes++;\n        maxPlyVisited"),
              ("    stats[6] = uint32_t(search.route.size());", "    stats[6] = uint32_t(search.route.size());\n    stats[7] = uint32_t(search.attackNodes);\n    stats[8] = uint32_t(search.attackNodes >> 32);"),
          ]
          for old,new in replacements:
              assert source.count(old)==1, "Rapfi instrumentation insertion changed: "+old
              source=source.replace(old,new,1)
          Path(".build/rapfi-vcf-instrumented.cpp").write_text(source)
          PY
          rapfi_root="$PWD/.build/rapfi/Rapfi"
          g++ -O3 -flto -DNDEBUG -std=c++17 \
            -I"$rapfi_root" -I"$rapfi_root/external/lz4/include" \
            tests/vcf-speed-symmetry-bench.cpp \
            rapfi/vcf-pattern-engine-optimized.cpp \
            rapfi/vcf-bitboard-engine.cpp \
            rapfi/vcf-bitboard-search-v2.cpp \
            rapfi/vcf-bitboard-legacy-extra.cpp \
            .build/rapfi-vcf-instrumented.cpp \
            "$rapfi_root/core/hash.cpp" \
            "$rapfi_root/core/utils.cpp" \
            "$rapfi_root/game/pattern.cpp" \
            "$rapfi_root/game/board.cpp" \
            "$rapfi_root/game/movegen.cpp" \
            "$rapfi_root/external/lz4/src/xxhash.c" \
            -o /tmp/vcf-speed-symmetry-bench
          /tmp/vcf-speed-symmetry-bench
