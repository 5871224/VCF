name: Apply record comment editor

on:
  push:
    paths:
      - .github/workflows/apply-record-comment-editor.yml
      - tools/apply-record-comment-editor.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply-record-comment-editor.py
      - name: Verify
        run: |
          node --check makevcf-layout.js
          node --check rapfi/rapfi-workbench-header.js
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf-layout.js rapfi/rapfi-workbench-header.js tests/workbench-architecture.test.js 規格書.MD
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "加入每盤面注釋顯示與編輯"
          git push origin HEAD:main
