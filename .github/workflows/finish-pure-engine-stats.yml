name: Finish pure engine stats migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-pure-engine-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply all pure timing changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Reuse the complete migration step (including stale test-contract update).
          lines = Path('.github/workflows/complete-pure-engine-stats.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'from pathlib import Path')
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start:end]))
          exec(compile(code, 'embedded-complete-pure-stats.py', 'exec'), {'__name__': '__main__'})

          html = Path('makevcf.html')
          text = html.read_text(encoding='utf-8')
          old_found = 'setStatus(`補${placeName}找${vcfName} VCF：${s5}四 ${n4} 個，VCF ${nV} 個（${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}）`);'
          new_found = 'setStatus(`補${placeName}找${vcfName} VCF：${s5}四 ${n4} 個，VCF ${nV} 個（${formatPureEngineStats(data)}）`);'
          old_empty = '} else { window._clearAnalysis(); setStatus(`補${placeName}找${vcfName} VCF：無結果（${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}）`); }'
          new_empty = '} else { window._clearAnalysis(); setStatus(`補${placeName}找${vcfName} VCF：無結果（${formatPureEngineStats(data)}）`); }'
          if old_found not in text or old_empty not in text:
              raise SystemExit('legacy add-search wall-clock status lines missing')
          text = text.replace(old_found, new_found, 1).replace(old_empty, new_empty, 1)
          html.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check rapfi/vcf-bitboard-main.js
          node --check rapfi/rapfi-bitboard-dashboard.js
          node --check rapfi/vcf-shortest-vcf-ui.js
          node tests/workbench-architecture.test.js
          python - <<'PY'
          from pathlib import Path
          html = Path('makevcf.html').read_text(encoding='utf-8')
          dashboard = Path('rapfi/rapfi-bitboard-dashboard.js').read_text(encoding='utf-8')
          shortest = Path('rapfi/vcf-shortest-vcf-ui.js').read_text(encoding='utf-8')
          bad = []
          for name, text in [('makevcf.html', html), ('dashboard', dashboard)]:
              for line in text.splitlines():
                  if 'setStatus(' in line and 'fmtRate(' in line:
                      bad.append(f'{name}: {line.strip()}')
          if 'const elapsedSeconds = (performance.now() - started) / 1000;' in shortest:
              raise SystemExit('shortest final result still uses wall-clock elapsed time')
          if bad:
              raise SystemExit('final status still uses wall-clock fmtRate:\n' + '\n'.join(bad))
          required = [
              'formatPureEngineStats(result)',
              'combinePureEngineStats(vcfResult, blockResult, data)',
              'formatPureEngineStats(combinePureEngineStats(vcfResult, data))',
              'formatPureEngineStats(data)',
          ]
          for token in required:
              if token not in html:
                  raise SystemExit(f'missing pure-stat integration: {token}')
          PY
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html rapfi/vcf-bitboard-main.js rapfi/rapfi-bitboard-dashboard.js rapfi/vcf-shortest-vcf-ui.js tests/workbench-architecture.test.js 規格書.MD
          git commit -m "Use pure engine timing for calculation speed"
          git push
