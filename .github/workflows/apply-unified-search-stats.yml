name: Apply unified search stats format

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-unified-search-stats.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch search result formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"找不到要修改的內容：{label}")
              return text.replace(old, new, 1)

          # 共用搜尋統計格式：固定 6 位小數、完整千分位、中文單位。
          path = Path("makevcf.html")
          text = path.read_text(encoding="utf-8")
          start = text.find("function elapsed(t0)")
          end = text.find("\n\nlet searching", start)
          if start < 0 or end < 0:
              raise SystemExit("找不到 makevcf.html 搜尋統計函式")
          new_helpers = '''function formatSearchInteger(value) {
            const number = Number(value);
            const rounded = Math.max(0, Math.round(Number.isFinite(number) ? number : 0));
            return rounded.toLocaleString("zh-TW");
          }
          function elapsed(t0) { return `${((performance.now() - t0) / 1000).toFixed(6)} 秒`; }
          function fmtNodes(n) { return `${formatSearchInteger(n)} 節點`; }
          function fmtRate(nodes, t0) {
            const sec = (performance.now() - t0) / 1000;
            const rate = sec > 0 ? Number(nodes || 0) / sec : 0;
            return `${formatSearchInteger(rate)} 節點/秒`;
          }'''
          text = text[:start] + new_helpers + text[end:]
          text = replace_once(
              text,
              'setStatus(`${cName} 無 VCF，不需防守（${elapsed(t0)}）`);',
              'setStatus(`${cName} 無 VCF，不需防守（${elapsed(t0)}，${fmtNodes(vcfResult.nodeCount)}，${fmtRate(vcfResult.nodeCount, t0)}）`);',
              "全部 VCF 防守無 VCF 提示",
          )
          text = replace_once(
              text,
              'setStatus(`${cName} 已有 VCF，共 ${vcfResult.winMoves[0].length} 手（${elapsed(t0)}）`);',
              'setStatus(`${cName} 已有 VCF，共 ${vcfResult.winMoves[0].length} 手（${elapsed(t0)}，${fmtNodes(vcfResult.nodeCount)}，${fmtRate(vcfResult.nodeCount, t0)}）`);',
              "VCT 點已有 VCF 提示",
          )
          path.write_text(text, encoding="utf-8")

          # 優化搜尋與速度比較面板沿用相同格式。
          path = Path("makevcf-optimized-search-v2.js")
          text = path.read_text(encoding="utf-8")
          rate_start = text.find("    function rate(nodes, seconds) {")
          rate_end = text.find("\n\n    function resultText", rate_start)
          if rate_start < 0 or rate_end < 0:
              raise SystemExit("找不到優化搜尋 rate 函式")
          new_rate = '''    function rate(nodes, seconds) {
              if (!Number.isFinite(nodes) || seconds <= 0) return "0 節點/秒";
              return `${formatSearchInteger(nodes / seconds)} 節點/秒`;
            }'''
          text = text[:rate_start] + new_rate + text[rate_end:]
          text = replace_once(
              text,
              '      return `${result.seconds.toFixed(6)}s｜${nodeText}｜${rateText}｜${outcome}${result.mode ? `｜${result.mode}` : ""}`;',
              '      return `${result.seconds.toFixed(6)} 秒，${nodeText}，${rateText}，${outcome}${result.mode ? `；${result.mode}` : ""}`;',
              "速度比較結果文字",
          )
          text = replace_once(
              text,
              'const timeMatch = text.match(/（([\\d.]+)s[，）]/);',
              'const timeMatch = text.match(/（([\\d.]+) 秒[，）]/);',
              "原版耗時解析格式",
          )
          text = replace_once(
              text,
              'const nodeMatch = text.match(/，([\\d.]+[MK]? nodes)/);',
              'const nodeMatch = text.match(/，([\\d,]+ 節點)/);',
              "原版節點解析格式",
          )
          text = replace_once(
              text,
              'const rateMatch = text.match(/，([\\d.]+[MK]? nodes\\/s)）/);',
              'const rateMatch = text.match(/，([\\d,]+ 節點\\/秒)(?:[；）])/);',
              "原版速度解析格式",
          )
          text = replace_once(
              text,
              'setStatus(`優化 ${name} VCF ${found ? `找到，共 ${route.length} 手` : "未找到"}（${seconds.toFixed(6)}s，${fmtNodes(nodes)}，${rate(nodes, seconds)}；${mode}）`);',
              'setStatus(`優化 ${name} VCF ${found ? `找到，共 ${route.length} 手` : "未找到"}（${seconds.toFixed(6)} 秒，${fmtNodes(nodes)}，${rate(nodes, seconds)}；${mode}）`);',
              "優化搜尋完成提示",
          )
          path.write_text(text, encoding="utf-8")

          # 最短 VCF 補上每秒節點，並改為固定 6 位小數。
          path = Path("rapfi/vcf-shortest-vcf-ui.js")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '    const formatNodes = value => `${Number(value || 0).toLocaleString("zh-TW")} 節點`;',
              '''    const formatInteger = value => {
                const number = Number(value);
                return Math.max(0, Math.round(Number.isFinite(number) ? number : 0)).toLocaleString("zh-TW");
              };
              const formatNodes = value => `${formatInteger(value)} 節點`;
              const formatRate = (nodes, elapsedSeconds) => {
                const rate = elapsedSeconds > 0 ? Number(nodes || 0) / elapsedSeconds : 0;
                return `${formatInteger(rate)} 節點/秒`;
              };''',
              "最短 VCF 統計函式",
          )
          text = replace_once(
              text,
              '''        const elapsedText = `${((performance.now() - started) / 1000).toFixed(3)} 秒`;
                  const statsText = `${elapsedText}，${formatNodes(info?.nodeCount)}`;''',
              '''        const elapsedSeconds = (performance.now() - started) / 1000;
                  const nodeCount = Number(info?.nodeCount || 0);
                  const statsText = `${elapsedSeconds.toFixed(6)} 秒，${formatNodes(nodeCount)}，${formatRate(nodeCount, elapsedSeconds)}`;''',
              "最短 VCF 完成統計",
          )
          path.write_text(text, encoding="utf-8")

          # Bitboard 多組後處理結果也必須包含完整三項統計。
          path = Path("rapfi/rapfi-bitboard-dashboard.js")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'setStatus(`${cName} VCF 後處理後無結果（${modeName}，${elapsed(t0)}，${fmtNodes(info?.nodeCount || 0)}）`);',
              'setStatus(`${cName} VCF 後處理後無結果（${modeName}，${elapsed(t0)}，${fmtNodes(info?.nodeCount || 0)}，${fmtRate(info?.nodeCount || 0, t0)}）`);',
              "Bitboard 後處理無結果提示",
          )
          path.write_text(text, encoding="utf-8")

          # 同步正式規格。
          path = Path("規格書.MD")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '- 狀態列應顯示精確秒數、節點數與 `nodes/s`。',
              '- 所有會顯示搜尋效能的完成提示，格式統一為「7.435100 秒，30,123,123 節點，4,123,123 節點/秒」；秒數固定 6 位小數，節點數與每秒節點使用千分位整數。',
              "主規格搜尋效能格式",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("新版Bitboard VCF規格.MD")
          text = path.read_text(encoding="utf-8")
          marker = '時間每 524,288 節點檢查一次；節點限制使用整數比較。'
          text = replace_once(
              text,
              marker,
              marker + '\n\n所有會顯示搜尋效能的完成提示，格式統一為「7.435100 秒，30,123,123 節點，4,123,123 節點/秒」；秒數固定 6 位小數，節點數與每秒節點使用千分位整數。',
              "Bitboard 規格搜尋效能格式",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")
          marker = '- 因限制中止時保留已找到結果，但不得描述為完整列舉。'
          text = replace_once(
              text,
              marker,
              marker + '\n- 搜尋完成提示的效能格式固定為 `7.435100 秒，30,123,123 節點，4,123,123 節點/秒`；秒數六位小數，節點與每秒節點使用千分位整數。',
              "開發規則搜尋效能格式",
          )
          path.write_text(text, encoding="utf-8")

          Path(".github/workflows/apply-unified-search-stats.yml").unlink()
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("makevcf.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          Path("/tmp/makevcf-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY

          node --check /tmp/makevcf-inline.js
          node --check makevcf-optimized-search-v2.js
          node --check rapfi/vcf-shortest-vcf-ui.js
          node --check rapfi/rapfi-bitboard-dashboard.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "統一搜尋速度顯示格式"
          git push
