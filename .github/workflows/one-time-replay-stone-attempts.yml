name: One-time replay stone attempts patch

on:
  push:
    paths:
      - .github/workflows/one-time-replay-stone-attempts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record every defender attempt in replay
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          progress = "makevcf-generator-progress.js"
          replace_once(
              progress,
              """    let lastSearchByBoard = new Map();
    let replayElements = null;
""",
              """    let lastSearchByBoard = new Map();
    let replayElements = null;
    let stoneAttemptCounts = new Map();
    let stoneAttemptBoardCounts = new Map();
""",
          )

          replace_once(
              progress,
              """    function updateReplayStep(index, updates) {
      const step = replaySteps[index];
      if (!step) return;
      Object.assign(step, updates);
    }

    function findStepByBoard(scopeId, signature) {
""",
              """    function updateReplayStep(index, updates) {
      const step = replaySteps[index];
      if (!step) return;
      Object.assign(step, updates);
    }

    window.__generatorReplayStoneAttempt = function generatorReplayStoneAttempt({
      board,
      attacker,
      idx,
      kind = "defense",
      phase = "mid",
    } = {}) {
      const point = Math.trunc(Number(idx));
      if (!board || point < 0 || point >= 225) return null;

      const scopeId = searchScope();
      const color = board[point];
      const pointKey = `${kind}:${point}`;
      const boardKey = `${pointKey}:${boardSignature(board)}`;
      const pointAttempt = (stoneAttemptCounts.get(pointKey) || 0) + 1;
      const boardAttempt = (stoneAttemptBoardCounts.get(boardKey) || 0) + 1;
      stoneAttemptCounts.set(pointKey, pointAttempt);
      stoneAttemptBoardCounts.set(boardKey, boardAttempt);

      const label = kind === "balance"
        ? "補齊子數"
        : phase === "final"
          ? "封鎖其他 VCF"
          : "補守";
      const detailParts = [`嘗試點 ${pointName(point)}`];
      if (pointAttempt > 1) {
        detailParts.push(`此座標第 ${pointAttempt} 次嘗試`);
      }
      if (boardAttempt > 1) {
        detailParts.push(`相同盤面第 ${boardAttempt} 次重複嘗試`);
      } else if (pointAttempt > 1) {
        detailParts.push("盤面不同時允許再次嘗試");
      }

      const index = addReplayStep({
        board,
        attacker: attacker || currentContext?.attacker || GEN_BLACK,
        scopeId,
        kind: `stone-${kind}`,
        title: `${label}：補上${colorName(color)} ${pointName(point)}`,
        status: "pending",
        reason: "已放下這一顆，正在重新驗證",
        detail: detailParts.join("；"),
        forceNew: true,
      });
      if (
        currentContext &&
        index >= 0 &&
        !currentContext.stepIndexes.includes(index)
      ) {
        currentContext.stepIndexes.push(index);
      }
      return { session: replaySession, index };
    };

    window.__generatorReplayStoneResult = function generatorReplayStoneResult(
      handle,
      passed,
      reason,
    ) {
      if (!handle || handle.session !== replaySession) return;
      updateReplayStep(handle.index, {
        status: passed ? "passed" : "failed",
        reason: reason || (
          passed
            ? "此補子分支已採用"
            : "此補子分支驗證失敗，已回溯"
        ),
      });
    };

    function findStepByBoard(scopeId, signature) {
""",
          )

          replace_once(
              progress,
              """        currentContext = null;
        lastSearchByBoard = new Map();
        finalScopeId = ++replayScope;
""",
              """        currentContext = null;
        lastSearchByBoard = new Map();
        stoneAttemptCounts = new Map();
        stoneAttemptBoardCounts = new Map();
        finalScopeId = ++replayScope;
""",
          )

          defense = "makevcf-generator-defense-points.js"
          replace_once(
              defense,
              """      if (!next.autoBlockDefenders.includes(idx)) {
        next.autoBlockDefenders.push(idx);
      }
      return next;
    }
""",
              """      if (!next.autoBlockDefenders.includes(idx)) {
        next.autoBlockDefenders.push(idx);
      }
      const replayHandle = window.__generatorReplayStoneAttempt?.({
        board: next.board,
        attacker: next.attacker,
        idx,
        kind: "defense",
        phase: "mid",
      });
      if (replayHandle) {
        Object.defineProperty(next, "__replayStoneHandle", {
          value: replayHandle,
          enumerable: false,
          configurable: true,
        });
      }
      return next;
    }
""",
          )

          replace_once(
              defense,
              """      const nextExpectedBoard = genCloneBoard(expectedBoard);
      nextExpectedBoard[idx] = next.defender;
      return { state: next, expectedBoard: nextExpectedBoard };
    }
""",
              """      const nextExpectedBoard = genCloneBoard(expectedBoard);
      nextExpectedBoard[idx] = next.defender;
      const replayHandle = window.__generatorReplayStoneAttempt?.({
        board: next.board,
        attacker: next.attacker,
        idx,
        kind: "defense",
        phase: "final",
      });
      return {
        state: next,
        expectedBoard: nextExpectedBoard,
        replayHandle,
      };
    }
""",
          )

          replace_once(
              defense,
              """        const result = await validateWithStreamingDefense(
          next,
          expectedSteps,
          previousResult,
          policy,
          budget,
        );
        if (result) return result;
""",
              """        const result = await validateWithStreamingDefense(
          next,
          expectedSteps,
          previousResult,
          policy,
          budget,
        );
        window.__generatorReplayStoneResult?.(
          next.__replayStoneHandle,
          Boolean(result),
          result
            ? "補上此點後成功保留目標並封鎖目前的不需要 VCF"
            : genCancelled
              ? "產生已停止，此補子分支未完成"
              : "補上此點後驗證未通過，已撤銷並回溯",
        );
        if (result) return result;
""",
          )

          replace_once(
              defense,
              """        const result = await cleanFinalTargetBoard(
          added.state,
          added.expectedBoard,
          targetSteps,
          budget,
        );
        if (result) return result;
""",
              """        const result = await cleanFinalTargetBoard(
          added.state,
          added.expectedBoard,
          targetSteps,
          budget,
        );
        window.__generatorReplayStoneResult?.(
          added.replayHandle,
          Boolean(result),
          result
            ? "補上此點後成功封鎖其他完成盤面"
            : genCancelled
              ? "產生已停止，此補子分支未完成"
              : "補上此點後仍無法完成唯一化，已撤銷並回溯",
        );
        if (result) return result;
""",
          )

          balance = "makevcf-generator-balance.js"
          old_balance = """  async function validateFilledState(state, idx, targetSteps) {
    const defender = genOther(state.attacker);
    const board = genCloneBoard(state.board);
    board[idx] = defender;

    if ((getLevelPoint(idx, defender, board) & GEN_SHAPE_MASK) >= GEN_FIVE) return null;

    const expectedBoard = genCloneBoard(state.standardBoard);
    expectedBoard[idx] = defender;
    const candidate = { ...state, board };
    const found = await genFindAnalyzedGroups(candidate);
    if (!found) return null;

    const { info, groups } = found;
    const analyzed = groups.map(moves => ({
      moves: Array.from(moves),
      analysis: genAnalyzeVCFGroup(board, moves, state.attacker),
    })).filter(item => item.analysis.valid);

    if (analyzed.some(item => item.analysis.steps < targetSteps)) return null;
    const target = analyzed.find(item =>
      item.analysis.steps === targetSteps &&
      genBoardsEqual(item.analysis.standardBoard, expectedBoard)
    );
    if (!target) return null;

    const nMask = genApplyRouteNPoints({ ...state, board }, target.moves);
    return {
      ...state,
      board,
      nMask,
      moves: target.moves,
      completedBoard: target.analysis.completedBoard,
      standardBoard: target.analysis.standardBoard,
      nodeCount: info.nodeCount || 0,
      groupCount: groups.length,
      totalAddedDefenders: (state.totalAddedDefenders || 0) + 1,
      balanceFillDefenders: [...(state.balanceFillDefenders || []), idx],
    };
  }
"""
          new_balance = """  async function validateFilledState(state, idx, targetSteps) {
    const defender = genOther(state.attacker);
    const board = genCloneBoard(state.board);
    board[idx] = defender;
    const replayHandle = window.__generatorReplayStoneAttempt?.({
      board,
      attacker: state.attacker,
      idx,
      kind: "balance",
      phase: "balance",
    });
    let accepted = false;

    try {
      if ((getLevelPoint(idx, defender, board) & GEN_SHAPE_MASK) >= GEN_FIVE) return null;

      const expectedBoard = genCloneBoard(state.standardBoard);
      expectedBoard[idx] = defender;
      const candidate = { ...state, board };
      const found = await genFindAnalyzedGroups(candidate);
      if (!found) return null;

      const { info, groups } = found;
      const analyzed = groups.map(moves => ({
        moves: Array.from(moves),
        analysis: genAnalyzeVCFGroup(board, moves, state.attacker),
      })).filter(item => item.analysis.valid);

      if (analyzed.some(item => item.analysis.steps < targetSteps)) return null;
      const target = analyzed.find(item =>
        item.analysis.steps === targetSteps &&
        genBoardsEqual(item.analysis.standardBoard, expectedBoard)
      );
      if (!target) return null;

      const nMask = genApplyRouteNPoints({ ...state, board }, target.moves);
      accepted = true;
      return {
        ...state,
        board,
        nMask,
        moves: target.moves,
        completedBoard: target.analysis.completedBoard,
        standardBoard: target.analysis.standardBoard,
        nodeCount: info.nodeCount || 0,
        groupCount: groups.length,
        totalAddedDefenders: (state.totalAddedDefenders || 0) + 1,
        balanceFillDefenders: [...(state.balanceFillDefenders || []), idx],
      };
    } finally {
      window.__generatorReplayStoneResult?.(
        replayHandle,
        accepted,
        accepted
          ? "補上此點後仍保留目標 VCF，採用此補子"
          : genCancelled
            ? "產生已停止，此補子分支未完成"
            : "補上此點後驗證未通過，已撤銷並回溯",
      );
    }
  }
"""
          replace_once(balance, old_balance, new_balance)
          PY

          node --check makevcf-generator-progress.js
          node --check makevcf-generator-defense-points.js
          node --check makevcf-generator-balance.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf-generator-progress.js makevcf-generator-defense-points.js makevcf-generator-balance.js
          git commit -m "record every defender attempt in generator replay"
          git push origin HEAD:main
