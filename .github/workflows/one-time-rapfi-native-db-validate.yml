name: One-time native Rapfi DB validation

on:
  push:
    paths:
      - .github/workflows/one-time-rapfi-native-db-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate VCF YXDB fixture
        shell: bash
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const formats = require('./rapfi/rapfi-workbench-header.js');
          const board = new Array(225).fill(0);
          board[112] = 1;
          board[113] = 2;
          const result = formats.createYXDB({
            board,
            routes: [[111, 126, 110]],
            attacker: 1,
            rule: 2,
          });
          if (result.recordCount !== 6) throw new Error(`expected 6 records, got ${result.recordCount}`);
          fs.writeFileSync('/tmp/vcf-native-test.db', Buffer.from(result.bytes));
          console.log(`generated ${result.recordCount} Rapfi positions, ${result.bytes.length} bytes`);
          NODE

      - name: Validate LZ4 frame with system decoder
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4
          lz4 -t /tmp/vcf-native-test.db

      - name: Build current Rapfi master
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/dhbloo/rapfi.git /tmp/rapfi
          git -C /tmp/rapfi fetch --depth 1 origin 3c94c2a976f24a0dd1c5517623e9ab6fffe66bd7
          git -C /tmp/rapfi checkout --detach 3c94c2a976f24a0dd1c5517623e9ab6fffe66bd7
          cmake -S /tmp/rapfi/Rapfi -B /tmp/rapfi-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_MULTI_THREADING=ON
          cmake --build /tmp/rapfi-build -j2

      - name: Open exported DB with Rapfi itself
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/rapfi-build/pbrain-rapfi database \
            --url /tmp/vcf-native-test.db \
            --commands 'DBSIZE;DBTOCSV /tmp/vcf-native-test.csv;QUIT' \
            2>&1 | tee /tmp/rapfi-db-output.txt
          test -s /tmp/vcf-native-test.csv
          test "$(($(wc -l < /tmp/vcf-native-test.csv) - 1))" -eq 6
          grep -F 'r-15-15---b' /tmp/vcf-native-test.csv
          grep -F 'Yixindb loaded 6 entries' /tmp/rapfi-db-output.txt
