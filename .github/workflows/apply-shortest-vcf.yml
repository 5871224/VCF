name: Apply shortest VCF implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-shortest-vcf.yml'
      - 'tools/apply_shortest_vcf.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: 3.1.74

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/implement-shortest-vcf'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/implement-shortest-vcf
          fetch-depth: 0

      - name: Restore Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: .build/emsdk
          key: vcf-emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .build/emsdk
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git .build/emsdk
          .build/emsdk/emsdk install "$EMSDK_VERSION"
          .build/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Apply source changes
        run: python3 tools/apply_shortest_vcf.py

      - name: Build and test Native
        shell: bash
        run: |
          set -euxo pipefail
          g++ rapfi/vcf-pattern-engine.cpp \
              rapfi/vcf-bitboard-engine.cpp \
              rapfi/vcf-bitboard-search-v2.cpp \
              rapfi/vcf-bitboard-legacy-extra.cpp \
              -O3 -flto -DNDEBUG -std=c++17 \
              -DVCF_BITBOARD_TEST_MAIN \
              -o /tmp/vcf-bitboard-engine-test
          /tmp/vcf-bitboard-engine-test
          node --check rapfi/vcf-bitboard-main.js
          node --check rapfi/vcf-bitboard-worker.js
          node --check rapfi/vcf-shortest-vcf-ui.js

      - name: Build production LTO SIMD Wasm
        shell: bash
        run: |
          set -euxo pipefail
          source .build/emsdk/emsdk_env.sh
          rm -rf /tmp/vcf-shortest-build
          mkdir -p /tmp/vcf-shortest-build
          em++ rapfi/vcf-pattern-engine.cpp \
               rapfi/vcf-bitboard-engine.cpp \
               rapfi/vcf-bitboard-search-v2.cpp \
               rapfi/vcf-bitboard-legacy-extra.cpp \
               -O3 -flto -DNDEBUG -std=c++17 -msimd128 \
               --no-entry \
               -s WASM=1 \
               -s MODULARIZE=1 \
               -s EXPORT_NAME=VCFBitboardModule \
               -s ENVIRONMENT='web,worker,node' \
               -s FILESYSTEM=0 \
               -s ALLOW_MEMORY_GROWTH=1 \
               -s "EXPORTED_FUNCTIONS=['_vcfBbFind','_vcfBbFindMode','_vcfBbFindModeV3','_vcfBbFindShortestOne','_vcfBbValidateRoute','_vcfBbRouteDefense','_vcfBbScanPoints','_vcfBbScanPointsMode','_vcfBbScanPointsModeV3','_vcfBbLegacyGetLevelPoint','_vcfBbLegacyTestLineFour','_vcfBbLegacyGetBlockFourPoint','_vcfBbLegacyIsFoul','_vcfBbLegacyGetLevelPointCompat','_vcfBbLegacyTestLineFourCompat','_vcfBbSelfTest','_vcfBbSearchV2SelfTest','_malloc','_free']" \
               -s "EXPORTED_RUNTIME_METHODS=['cwrap']" \
               -o /tmp/vcf-shortest-build/vcf-bitboard-engine.js

      - name: Run Wasm ABI and 111-ply proof
        shell: bash
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const path = require('path');
          const buildDir = '/tmp/vcf-shortest-build';
          const createModule = require(path.join(buildDir, 'vcf-bitboard-engine.js'));
          const question = '000000000222000020000111000000000010020010000020100000021000001000200020100000020000000200012000000000010010000010000010010200001200010000000000000002001000000000100000100000201202000012002210000200000111000000020200000220000';
          createModule({ locateFile: file => path.join(buildDir, file) }).then(module => {
            const selfTest = module.cwrap('vcfBbSelfTest', 'number', []);
            const searchTest = module.cwrap('vcfBbSearchV2SelfTest', 'number', []);
            const shortest = module.cwrap('vcfBbFindShortestOne', 'number', Array(9).fill('number'));
            if (selfTest() !== 0) throw new Error('base self-test failed');
            if (searchTest() !== 0) throw new Error('search self-test failed');
            const board = module._malloc(225);
            const moves = module._malloc(224);
            const length = module._malloc(2);
            const stats = module._malloc(16);
            for (let i = 0; i < 225; i++) module.HEAPU8[board + i] = Number(question[i]);
            module.HEAPU16[length >>> 1] = 0;
            const packed = (0x80000000 + 30 * 1024 + 20) >>> 0;
            const status = shortest(board, 1, 2, 200, packed, moves, length, 224, stats);
            const routeLength = module.HEAPU16[length >>> 1];
            const view = new DataView(module.HEAPU8.buffer, stats, 16);
            const nodes = view.getUint32(0, true);
            const aborted = Boolean(view.getUint8(14));
            console.log({ status, routeLength, nodes, aborted });
            if (status !== 2 || routeLength !== 111 || aborted)
              throw new Error(`111-ply shortest proof failed: status=${status}, length=${routeLength}, aborted=${aborted}`);
            module._free(stats);
            module._free(length);
            module._free(moves);
            module._free(board);
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add AGENTS.md "新版Bitboard VCF規格.MD" rapfi
          git commit -m "新增保證最短 VCF 搜尋"
          git push origin HEAD:agent/implement-shortest-vcf
