name: One-time cloud load fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cloud-load.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Make cloud load restore the board
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Expose the existing DB/LIB importer as a reusable byte API.
          p = Path('makevcf-layout.js')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'  async function loadRecordFile\(file\) \{.*?\n  \}\n\n  function installRecordImportControls\(\) \{', re.S)
          replacement = r'''  function deepestImportedNode(tree) {
    let best = tree?.current || null;
    const visit = node => {
      if (!node) return;
      if (!node.synthetic && (!best || Number(node.ply || 0) > Number(best.ply || 0))) best = node;
      for (const child of node.children || []) visit(child);
    };
    visit(tree?.root);
    return best || tree?.current || null;
  }

  async function loadRecordBytes(rawBytes, fileName = "棋譜.db", options = {}) {
    const bytes = rawBytes instanceof Uint8Array ? rawBytes : new Uint8Array(rawBytes || 0);
    const lowerName = String(fileName || "").toLowerCase();
    const looksRenLib = lowerName.endsWith(".lib")
      || (bytes.length >= 8 && bytes[0] === 0xff && bytes[1] === 0x52 && bytes[2] === 0x65 && bytes[3] === 0x6e);
    const tree = looksRenLib ? parseRenLib(bytes) : parseYXDB(bytes);
    document.getElementById("btn-clear-vcf")?.click();
    importedTree = tree;
    importedTree.fileName = fileName || (looksRenLib ? "棋譜.lib" : "棋譜.db");
    replaySignature = "";
    replayPly = 0;
    if (tree.rule != null && typeof window.vcfSetRules === "function") await window.vcfSetRules(tree.rule);
    const target = options?.openAtEnd ? deepestImportedNode(tree) : tree.current;
    renderImportedNode(target || tree.current);
    return {
      format: tree.format,
      nodeCount: tree.nodeCount,
      rootCount: tree.rootCount,
      currentPly: Number(importedTree.current?.ply || 0),
    };
  }

  async function loadRecordFile(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    return loadRecordBytes(bytes, file.name || "棋譜.db", { openAtEnd: false });
  }

  window.VCFRecordImportAPI = {
    loadBytes(bytes, fileName = "雲端棋譜.db", options = {}) {
      return loadRecordBytes(bytes, fileName, options);
    },
  };

  function installRecordImportControls() {'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'loadRecordFile block replace count={count}')
          p.write_text(text2, encoding='utf-8')

          # 2) Cloud load now restores the workbench and also keeps the WASM index.
          p = Path('rapfi/vcf-lz4-cloud.js')
          text = p.read_text(encoding='utf-8')
          old = '''  async function load(id) {
    const result = await fetchRecord(id);
    await loadIntoIndex(result.bytes, result.meta);
    return result.bytes;
  }'''
          new = '''  async function load(id) {
    const result = await fetchRecord(id);
    await loadIntoIndex(result.bytes, result.meta);
    const importer = global.VCFRecordImportAPI;
    if (!importer?.loadBytes) throw new Error("棋譜載入模組尚未就緒，請重新整理頁面後再試");
    const title = String(result.meta?.title || "").trim();
    const imported = await importer.loadBytes(result.bytes, title ? `${title}.db` : `雲端棋譜-${id}.db`, { openAtEnd: true });
    return { ...result, imported, indexedMeta };
  }'''
          if old not in text:
              raise SystemExit('cloud load function not found')
          text = text.replace(old, new, 1)
          text = text.replace('loadButton.textContent = "載入＋建立索引";', 'loadButton.textContent = "載入棋譜";', 1)
          old_handler = 'loadButton.addEventListener("click", async () => { loadButton.disabled = true; try { await load(record.id); status(`已建立 WASM 索引：${indexedMeta.recordCount} 局面 / ${indexedMeta.indexSlots} slots / raw ${formatBytes(indexedMeta.rawSize)}`); dialog.close(); } catch (e) { status(e.message || String(e)); } finally { loadButton.disabled = false; } });'
          new_handler = 'loadButton.addEventListener("click", async () => { loadButton.disabled = true; try { const loaded = await load(record.id); status(`已載入「${record.title || `棋譜 #${record.id}`}」：${loaded.imported?.nodeCount || indexedMeta.recordCount} 個局面；WASM 索引 ${indexedMeta.recordCount} 局面`); dialog.close(); } catch (e) { status(e.message || String(e)); } finally { loadButton.disabled = false; } });'
          if old_handler not in text:
              raise SystemExit('cloud load button handler not found')
          text = text.replace(old_handler, new_handler, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Cache-bust both changed browser modules.
          p = Path('makevcf.html')
          text = p.read_text(encoding='utf-8')
          text, count = re.subn(r'makevcf-layout\.js\?v=[^"\']+', 'makevcf-layout.js?v=20260913-cloud-load-board', text, count=1)
          if count != 1:
              raise SystemExit('makevcf-layout cache tag not found')
          p.write_text(text, encoding='utf-8')

          p = Path('tools/prepare-pages-site.py')
          text = p.read_text(encoding='utf-8')
          text, count = re.subn(r'rapfi/vcf-lz4-cloud\.js\?v=[^"\']+', 'rapfi/vcf-lz4-cloud.js?v=20260913-cloud-load-board', text, count=1)
          if count != 1:
              raise SystemExit('cloud cache tag not found')
          p.write_text(text, encoding='utf-8')

          # 4) Keep the product spec authoritative.
          p = Path('規格書.MD')
          text = p.read_text(encoding='utf-8')
          anchor = '- 工作台可直接讀取 Rapfi YXDB `.db`（含 Rapfi 預設 LZ4 frame）與 RenLib `.lib`；棋盤下方固定顯示「棋譜導覽」，提供「上一步、下一步、前一分支、後一分支」四個按鈕。沒有可瀏覽內容時按鈕仍保留固定位置，不得因無棋譜而隱藏。\n'
          addition = anchor + '- 雲端 YXDB 的「載入棋譜」必須同時把該 YXDB 載入工作台棋盤／棋譜導覽，並建立 WASM 查詢索引；不得只在背景建立索引而不改變盤面。雲端載入後預設顯示該 YXDB 可重建分支中的最深末端局面。YXDB 以 canonical position 保存，不承諾保留原始畫面方向或原本的目前分支選取。\n'
          if anchor not in text:
              raise SystemExit('spec anchor not found')
          text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')

          # 5) Architecture contracts: shared importer, cloud->import bridge, cache versions.
          p = Path('tests/workbench-architecture.test.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("makevcf-layout.js?v=20260826-record-tools-v2", "makevcf-layout.js?v=20260913-cloud-load-board", 1)
          anchor = "const recordToolsMarkerToggle = read(\"rapfi/vcf-record-tools.js\");\n"
          addition = '''const cloudYXDB = read("rapfi/vcf-lz4-cloud.js");
for (const token of [
  'window.VCFRecordImportAPI = {',
  'loadRecordBytes(rawBytes',
  'options?.openAtEnd ? deepestImportedNode(tree) : tree.current',
]) if (!layout.includes(token)) throw new Error(`record byte importer contract missing: ${token}`);
for (const token of [
  'const importer = global.VCFRecordImportAPI;',
  'importer.loadBytes(result.bytes',
  'loadButton.textContent = "載入棋譜";',
]) if (!cloudYXDB.includes(token)) throw new Error(`cloud record load contract missing: ${token}`);
const pagesBuilderCloud = read("tools/prepare-pages-site.py");
if (!pagesBuilderCloud.includes('rapfi/vcf-lz4-cloud.js?v=20260913-cloud-load-board')) {
  throw new Error("cloud record script must be cache-busted in Pages artifact");
}

const recordToolsMarkerToggle = read("rapfi/vcf-record-tools.js");
'''
          if anchor not in text:
              raise SystemExit('architecture anchor not found')
          text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

          node --check makevcf-layout.js
          node --check rapfi/vcf-lz4-cloud.js
          npm run test:architecture
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makevcf-layout.js rapfi/vcf-lz4-cloud.js makevcf.html tools/prepare-pages-site.py tests/workbench-architecture.test.js '規格書.MD'
          git commit -m 'Load cloud YXDB into the workbench'
          git push
