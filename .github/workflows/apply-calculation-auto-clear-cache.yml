name: One-time calculation auto-clear validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-calculation-auto-clear-cache.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate auto-clear policy
        run: |
          node --check rapfi/vcf-shortest-vcf-ui.js
          python - <<'PY'
          from pathlib import Path
          js = Path('rapfi/vcf-shortest-vcf-ui.js').read_text(encoding='utf-8')
          required = [
              '"btn-black"', '"btn-white"', '"btn-multi-vcf"', '"btn-shortest-vcf"',
              '"btn-block-vcf-all"', '"btn-level3"', '"btn-add-black"', '"btn-add-white"',
              'document.getElementById("btn-clear-vcf")?.click()',
              'document.addEventListener("click", event =>',
          ]
          for token in required:
              assert token in js, f'missing auto-clear contract: {token}'
          policy = js[js.index('const AUTO_CLEAR_CALCULATION_IDS'):js.index('document.addEventListener("click"')]
          assert '"btn-block-vcf"' not in policy, 'single-route defense must preserve current VCF markers'
          html_path = Path('makevcf.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace(
              'rapfi/vcf-shortest-vcf-ui.js"></script>',
              'rapfi/vcf-shortest-vcf-ui.js?v=20260913-auto-clear-preflight"></script>',
          )
          assert 'vcf-shortest-vcf-ui.js?v=20260913-auto-clear-preflight' in html
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Run architecture test
        run: node tests/workbench-architecture.test.js
      - name: Commit cache version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cache-bust change needed"
            exit 0
          fi
          git commit -m "Bust calculation preflight browser cache"
          git push
