name: Move cloud API under BD once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-cloud-api-under-bd-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update frontend API paths and docs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            Path('rapfi/vcf-lz4-cloud.js'): [
              ('const API_URL = "https://587.renju.org.tw/vcf/yxdb.php";', 'const API_URL = "api/yxdb.php";'),
            ],
            Path('rapfi/vcf-google-popup-auth.js'): [
              ('const LOGIN_URL = "https://587.renju.org.tw/vcf/google-login.php";', 'const LOGIN_URL = "api/google-login.php";'),
              ('const LOGIN_ORIGIN = "https://587.renju.org.tw";', 'const LOGIN_ORIGIN = global.location.origin;'),
            ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'anchor missing in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          for name in ('規格書.MD', '檔案用途總覽.MD'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('https://587.renju.org.tw/vcf/yxdb.php', 'https://587.renju.org.tw/BD/api/yxdb.php')
              text = text.replace('https://587.renju.org.tw/vcf/google-login.php', 'https://587.renju.org.tw/BD/api/google-login.php')
              text = text.replace('/vcf/yxdb.php', '/BD/api/yxdb.php')
              text = text.replace('/vcf/google-login.php', '/BD/api/google-login.php')
              path.write_text(text, encoding='utf-8')

          spec = Path('規格書.MD')
          text = spec.read_text(encoding='utf-8')
          marker = '## BD 同站 API 位置'
          if marker not in text:
              text += '\n\n## BD 同站 API 位置\n\n正式站前端位於 `/BD/`；雲端棋譜與 Google 登入後端位於 `/BD/api/`。前端使用 `api/yxdb.php` 與 `api/google-login.php` 相對路徑，同站呼叫，不再使用網站根目錄 `/vcf/`。瀏覽器端不得直接連線資料庫，資料庫存取與登入驗證仍由 PHP API 負責。\n'
              spec.write_text(text, encoding='utf-8')
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check rapfi/vcf-lz4-cloud.js
          node --check rapfi/vcf-google-popup-auth.js
          npm run test:architecture
          node tests/lz4-cloud.test.js
          ! grep -R --line-number --fixed-strings 'https://587.renju.org.tw/vcf/' rapfi tests 規格書.MD 檔案用途總覽.MD
      - name: Commit source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rapfi/vcf-lz4-cloud.js rapfi/vcf-google-popup-auth.js 規格書.MD 檔案用途總覽.MD
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Move cloud API paths under BD'
          git push
