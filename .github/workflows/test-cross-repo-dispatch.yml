name: Test cross-repo dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cross-repo-dispatch.yml'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fSsL \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/5871224/587-RENJU/dispatches \
            -d '{"event_type":"vcf-test","client_payload":{"sha":"'${GITHUB_SHA}'"}}'
