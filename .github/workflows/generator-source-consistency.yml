name: Generator Source Consistency

on:
  pull_request:
    branches: [main]
    paths:
      - 'makevcf.html'
      - 'makevcf-mobile.js'
      - 'makevcf-optimized-search-v2.js'
      - 'makevcf-generator-*.js'
      - 'eval/Evaluator.js'
      - 'rapfi/vcf-bitboard-generator-compat.js'
      - 'tools/apply-image-import-build-fixes.js'
      - 'tools/apply-generator-replay-event-fixes.js'
      - 'tests/generator-source-order.test.js'
      - 'tests/generator-context.test.js'
      - '.github/workflows/generator-source-consistency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-architecture-refactor:
    if: github.head_ref == 'agent/generator-final-architecture'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final architecture branch
        uses: actions/checkout@v6
        with:
          ref: agent/generator-final-architecture
          fetch-depth: 0

      - name: Check whether refactor is already applied
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[final architecture applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply final architecture refactor
        if: steps.guard.outputs.skip != 'true'
        run: python tools/refactor-generator-final-architecture.py

      - name: Check generator JavaScript syntax
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          for file in makevcf-generator-*.js; do
            node --check "$file"
          done

      - name: Run final architecture tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          node tests/generator-architecture-v2.test.js
          node tests/generator-registry-v2.test.js
          node tests/generator-search-policy-v2.test.js
          node tests/generator-finalize-v2.test.js
          node tests/generator-source-order.test.js
          node tests/generator-context.test.js
          node tests/generator-layout-replay.test.js
          node tools/apply-generator-replay-event-fixes.js
          node tools/apply-image-import-build-fixes.js
          git diff --check

      - name: Commit final architecture sources
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -f tools/refactor-generator-final-architecture.py
          rm -f tools/.generator-final-architecture-v2-payload-*
          rm -f tools/.generator-final-architecture-payload-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            ':!.github/workflows/refactor-generator-final-architecture.yml' \
            ':!.github/workflows/generator-source-consistency.yml'
          git commit -m "完成題目產生器最終架構整理 [final architecture applied]"
          git push origin HEAD:agent/generator-final-architecture

  source-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check generator JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          for file in makevcf-generator-*.js makevcf-mobile.js makevcf-optimized-search-v2.js \
            eval/Evaluator.js rapfi/vcf-bitboard-generator-compat.js; do
            node --check "$file"
          done

      - name: Verify generator source and context
        shell: bash
        run: |
          set -euxo pipefail
          node tests/generator-source-order.test.js
          node tests/generator-context.test.js

      - name: Verify build checks are read-only
        shell: bash
        run: |
          set -euxo pipefail
          node tools/apply-image-import-build-fixes.js
          node tools/apply-generator-replay-event-fixes.js
          git diff --exit-code
