name: One-time search stats display repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-search-stats-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Repair search result statistics display
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source not found in {path}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Passive VCF result synchronization must not overwrite the completed
          # search summary (elapsed time / nodes / nodes per second).
          replace_once(
              'makevcf-layout.js',
              '  function renderCalculationDisplay() {',
              '  function renderCalculationDisplay({ updateStatus = true } = {}) {',
              'calculation display signature',
          )
          replace_once(
              'makevcf-layout.js',
              '    if (typeof setStatus === "function") {\n      const color = calculationDisplay.color === WHITE ? "白" : "黑";\n      setStatus(`展示計算：${color}方第 ${calculationDisplay.groupIndex + 1}/${calculationDisplay.groups.length} 組，第 ${ply}/${route.length} 手`);\n    }',
              '    if (updateStatus && typeof setStatus === "function") {\n      const color = calculationDisplay.color === WHITE ? "白" : "黑";\n      setStatus(`展示計算：${color}方第 ${calculationDisplay.groupIndex + 1}/${calculationDisplay.groups.length} 組，第 ${ply}/${route.length} 手`);\n    }',
              'calculation display status guard',
          )
          replace_once(
              'makevcf-layout.js',
              '  window.addEventListener("vcf-result-changed", event => {\n    if (event.detail?.hasResult && captureCalculationResult()) {\n      renderCalculationDisplay();\n    } else {\n      resetCalculationDisplay({ clearOverlay: false });\n    }\n  });',
              '  window.addEventListener("vcf-result-changed", event => {\n    if (event.detail?.hasResult && captureCalculationResult()) {\n      // 搜尋完成後只同步展示面板；保留搜尋本身的耗時、節點與速度完成提示。\n      renderCalculationDisplay({ updateStatus: false });\n    } else {\n      resetCalculationDisplay({ clearOverlay: false });\n    }\n  });',
              'passive calculation result sync',
          )

          # The worker already returns full getBlockVCF statistics. Keep the
          # legacy points-only response by default, but allow the workbench to
          # explicitly request the detailed result.
          replace_once(
              'rapfi/vcf-bitboard-main.js',
              '        case "getBlockVCF": {\n          const result = await this.main.call("getBlockVCF", { ...normalized, rules: this.rules });\n          return result.points;\n        }',
              '        case "getBlockVCF": {\n          const result = await this.main.call("getBlockVCF", { ...normalized, rules: this.rules });\n          return normalized.includeStats ? result : result.points;\n        }',
              'getBlockVCF detail bridge',
          )

          replace_once(
              'makevcf.html',
              '  async getBlockVCF({ arr, color, vcfMoves }) {\n    await this._initP;\n    return await this._post("getBlockVCF", { arr, color, vcfMoves, includeFour: true });\n  }',
              '  async getBlockVCF({ arr, color, vcfMoves }) {\n    await this._initP;\n    return await this._post("getBlockVCF", { arr, color, vcfMoves, includeFour: true, includeStats: true });\n  }',
              'workbench block stats request',
          )

          replace_once(
              'makevcf.html',
              '    const result = await engine.getBlockVCF({ arr, color, vcfMoves: lastVCFMoves });\n    if (!result) return;\n    if (result.length) {\n      window._showAnalysisTriangles(result, "#00cc44");\n      setStatus(`${cName} VCF 防守點：${result.length} 個（${elapsed(t0)}）`);\n    } else { window._clearAnalysis(); setStatus(`${cName} 未找到 VCF 防守點（${elapsed(t0)}）`); }',
              '    const result = await engine.getBlockVCF({ arr, color, vcfMoves: lastVCFMoves });\n    if (!result) return;\n    const points = Array.isArray(result) ? result : (Array.isArray(result.points) ? result.points : []);\n    const nodeCount = Array.isArray(result) ? 0 : Number(result.nodeCount || 0);\n    if (points.length) {\n      window._showAnalysisTriangles(points, "#00cc44");\n      setStatus(`${cName} VCF 防守點：${points.length} 個（${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}）`);\n    } else { window._clearAnalysis(); setStatus(`${cName} 未找到 VCF 防守點（${elapsed(t0)}，${fmtNodes(nodeCount)}，${fmtRate(nodeCount, t0)}）`); }',
              'single route defense stats',
          )

          replace_once(
              'makevcf.html',
              '    setStatus(`取得 ${cName} VCF 防守候選點...`);\n    const candidates = await engine.getBlockVCF({ arr, color, vcfMoves: lastVCFMoves });\n    if (!candidates) return;\n    if (!candidates.length) {\n      window._clearAnalysis();\n      setStatus(`${cName} 未找到 VCF 防守候選點（${elapsed(t0)}）`);\n      return;\n    }',
              '    setStatus(`取得 ${cName} VCF 防守候選點...`);\n    const blockResult = await engine.getBlockVCF({ arr, color, vcfMoves: lastVCFMoves });\n    if (!blockResult) return;\n    const candidates = Array.isArray(blockResult) ? blockResult : (Array.isArray(blockResult.points) ? blockResult.points : []);\n    const blockNodeCount = Array.isArray(blockResult) ? 0 : Number(blockResult.nodeCount || 0);\n    if (!candidates.length) {\n      window._clearAnalysis();\n      const totalNodes = Number(vcfResult.nodeCount || 0) + blockNodeCount;\n      setStatus(`${cName} 未找到 VCF 防守候選點（${elapsed(t0)}，${fmtNodes(totalNodes)}，${fmtRate(totalNodes, t0)}）`);\n      return;\n    }',
              'all route defense candidate stats',
          )

          replace_once(
              'makevcf.html',
              '    const confirmed = candidates.filter(idx => !stillVCF.has(idx));\n\n    window._clearAnalysis();\n    if (confirmed.length) {\n      window._showAnalysisTriangles(confirmed, "#4488ff");\n      setStatus(`${cName} 全部VCF防守：${confirmed.length} 個有效防守點（${elapsed(t0)}，${fmtNodes(data.nodeCount)}，${fmtRate(data.nodeCount, t0)}）`);\n    } else {\n      setStatus(`${cName} 無有效防守點（${elapsed(t0)}，${fmtNodes(data.nodeCount)}，${fmtRate(data.nodeCount, t0)}）`);\n    }',
              '    const confirmed = candidates.filter(idx => !stillVCF.has(idx));\n    const totalNodes = Number(vcfResult.nodeCount || 0) + blockNodeCount + Number(data.nodeCount || 0);\n\n    window._clearAnalysis();\n    if (confirmed.length) {\n      window._showAnalysisTriangles(confirmed, "#4488ff");\n      setStatus(`${cName} 全部VCF防守：${confirmed.length} 個有效防守點（${elapsed(t0)}，${fmtNodes(totalNodes)}，${fmtRate(totalNodes, t0)}）`);\n    } else {\n      setStatus(`${cName} 無有效防守點（${elapsed(t0)}，${fmtNodes(totalNodes)}，${fmtRate(totalNodes, t0)}）`);\n    }',
              'all route defense aggregate stats',
          )

          # Browser cache busts for the changed UI and bridge modules.
          replace_once(
              'makevcf.html',
              'document.write(\'<script src="rapfi/vcf-bitboard-main.js"><\\/script>\');',
              'document.write(\'<script src="rapfi/vcf-bitboard-main.js?v=20260913-search-stats"><\\/script>\');',
              'bitboard main cache version',
          )
          replace_once(
              'makevcf.html',
              '<script src="makevcf-layout.js?v=20260913-calc-display-v2"></script>',
              '<script src="makevcf-layout.js?v=20260913-search-stats"></script>',
              'layout cache version',
          )

          spec = Path('規格書.MD')
          text = spec.read_text(encoding='utf-8')
          anchor = '- 搜尋期間停用會改變搜尋語意的控制項。\n'
          addition = ('- 搜尋與防守計算完成後，狀態列必須保留耗時、節點數與節點/秒；「展示計算」的被動結果同步不得覆蓋這份完成提示。只有使用者手動切換計算組別或逐手回放時，才可改寫為展示位置。\n')
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('spec insertion anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
              spec.write_text(text, encoding='utf-8')

          test = Path('tests/workbench-architecture.test.js')
          text = test.read_text(encoding='utf-8')
          anchor = 'if (!layout.includes("VCF 計算展示只使用 SVG overlay，不呼叫 _setBoardArr，也不寫入 VCFWorkbenchRecord")) {\n  throw new Error("calculation display isolation contract missing");\n}\n'
          addition = '''if (!layout.includes("function renderCalculationDisplay({ updateStatus = true } = {})")\n    || !layout.includes("renderCalculationDisplay({ updateStatus: false })")\n    || !layout.includes('if (updateStatus && typeof setStatus === "function")')) {\n  throw new Error("calculation result sync must preserve completed search statistics");\n}\nconst workbenchHtml = read("makevcf.html");\nif (!workbenchHtml.includes("includeStats: true")\n    || !workbenchHtml.includes("const totalNodes = Number(vcfResult.nodeCount || 0) + blockNodeCount + Number(data.nodeCount || 0)")) {\n  throw new Error("defense statistics display contract missing");\n}\nif (!main.includes("normalized.includeStats ? result : result.points")) {\n  throw new Error("getBlockVCF detailed statistics bridge missing");\n}\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('test insertion anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
              test.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check makevcf-layout.js
          node --check rapfi/vcf-bitboard-main.js
          node tests/workbench-architecture.test.js
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf-layout.js rapfi/vcf-bitboard-main.js makevcf.html tests/workbench-architecture.test.js 規格書.MD
          git commit -m "Restore calculation node and speed status"
          git push
