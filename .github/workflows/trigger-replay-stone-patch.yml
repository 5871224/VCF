name: Trigger replay stone patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-replay-stone-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply embedded replay patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-time-replay-stone-attempts.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          node --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          exec(compile(code, 'embedded-replay-patch.py', 'exec'))
          PY

          node --check makevcf-generator-progress.js
          node --check makevcf-generator-defense-points.js
          node --check makevcf-generator-balance.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf-generator-progress.js makevcf-generator-defense-points.js makevcf-generator-balance.js
          git commit -m "record every defender attempt in generator replay"
          git push origin HEAD:main
