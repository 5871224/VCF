name: Apply preview circle style

on:
  push:
    branches: [main]
    paths:
      - tools/apply-preview-circle-style.js
      - .github/workflows/apply-preview-circle-style.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply preview circle style
        run: node tools/apply-preview-circle-style.js

      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('makevcf.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/makevcf-inline.js').write_text(html[start:end], encoding='utf-8')
          for token in ('rgba(38, 117, 235, 0.95)', 'rgba(235, 193, 36, 0.95)'):
              if token not in html:
                  raise RuntimeError(f'Missing preview token: {token}')
          for token in ('manualEdits', 'rgba(255, 145, 0, 0.95)', 'rgba(0, 0, 0, 0.43)', 'rgba(255, 255, 255, 0.40)'):
              if token in html:
                  raise RuntimeError(f'Obsolete preview token remains: {token}')
          PY
          node --check /tmp/makevcf-inline.js
          git diff --check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html 規格書.MD
          git commit -m "調整圖片匯入預覽圓框樣式"
          git push
