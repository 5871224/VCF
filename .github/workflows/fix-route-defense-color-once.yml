name: Fix route defense color once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-route-defense-color-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch route color and invalid-route guard
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          html_path = Path('makevcf.html')
          html = html_path.read_text(encoding='utf-8')

          old_state = '''let lastParam = null;
          let lastVCFMoves = null;
          let vcfGroups = null;
          '''
          new_state = '''let lastParam = null;
          let lastVCFMoves = null;
          let lastVCFColor = 1;
          let vcfGroups = null;
          '''
          if html.count(old_state) != 1:
              raise SystemExit('makevcf state block not found exactly once')
          html = html.replace(old_state, new_state, 1)

          old_group = '''function setVcfGroup(idx) {
            vcfGroupIdx = idx;
            lastVCFMoves = vcfGroups[idx];
            window._showVCF(lastVCFMoves, vcfGroupColor);
          '''
          new_group = '''function setVcfGroup(idx) {
            vcfGroupIdx = idx;
            lastVCFMoves = vcfGroups[idx];
            lastVCFColor = vcfGroupColor;
            window._showVCF(lastVCFMoves, vcfGroupColor);
          '''
          if html.count(old_group) != 1:
              raise SystemExit('setVcfGroup block not found exactly once')
          html = html.replace(old_group, new_group, 1)

          old_search = '''async function doSearch(arr, color) {
            lastParam = { arr, color };
            setBusy(true);
          '''
          new_search = '''async function doSearch(arr, color) {
            lastParam = { arr, color };
            lastVCFMoves = null;
            lastVCFColor = color;
            setBusy(true);
          '''
          if html.count(old_search) != 1:
              raise SystemExit('base doSearch block not found exactly once')
          html = html.replace(old_search, new_search, 1)

          old_button = '''document.getElementById("btn-block-vcf").addEventListener("click", async () => {
            if (!lastVCFMoves || !lastVCFMoves.length) { setStatus("請先計算出 VCF 路線，再查 VCF 防守點"); return; }
            const arr = window._getArr();
            const color = getAColor();
            const cName = color===1 ? "黑" : "白";
          '''
          new_button = '''document.getElementById("btn-block-vcf").addEventListener("click", async () => {
            if (!lastVCFMoves || !lastVCFMoves.length) { setStatus("請先計算出 VCF 路線，再查 VCF 防守點"); return; }
            const arr = window._getArr();
            // 必須使用產生目前手順時的攻方顏色；分析色只供其他分析功能選色。
            const color = lastVCFColor;
            const cName = color===1 ? "黑" : "白";
          '''
          if html.count(old_button) != 1:
              raise SystemExit('single route defense button block not found exactly once')
          html = html.replace(old_button, new_button, 1)

          old_all = '''    lastVCFMoves = vcfResult.winMoves[0];
              document.getElementById("btn-block-vcf").disabled = false;
          '''
          new_all = '''    lastVCFMoves = vcfResult.winMoves[0];
              lastVCFColor = color;
              document.getElementById("btn-block-vcf").disabled = false;
          '''
          if html.count(old_all) != 1:
              raise SystemExit('all route defense remembered route block not found exactly once')
          html = html.replace(old_all, new_all, 1)

          old_vct = '''      lastVCFMoves = vcfResult.winMoves[0];
                window._showVCF(vcfResult.winMoves[0], color);
          '''
          new_vct = '''      lastVCFMoves = vcfResult.winMoves[0];
                lastVCFColor = color;
                window._showVCF(vcfResult.winMoves[0], color);
          '''
          if html.count(old_vct) != 1:
              raise SystemExit('VCT remembered route block not found exactly once')
          html = html.replace(old_vct, new_vct, 1)
          html_path.write_text(html, encoding='utf-8')

          dashboard_path = Path('rapfi/rapfi-bitboard-dashboard.js')
          dashboard = dashboard_path.read_text(encoding='utf-8')
          old_dashboard_search = '''    doSearch = async function(arr, color) {
                lastParam = { arr, color };
                setBusy(true);
          '''
          new_dashboard_search = '''    doSearch = async function(arr, color) {
                lastParam = { arr, color };
                lastVCFMoves = null;
                lastVCFColor = color;
                setBusy(true);
          '''
          if dashboard.count(old_dashboard_search) != 1:
              raise SystemExit('dashboard doSearch block not found exactly once')
          dashboard = dashboard.replace(old_dashboard_search, new_dashboard_search, 1)
          dashboard_path.write_text(dashboard, encoding='utf-8')

          worker_path = Path('rapfi/vcf-bitboard-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          old_guard = '''  if (!routeLen || (routeLen & 1) === 0) {
              return {
                nodeCount: 0,
                elapsedMs: performance.now() - startedAt,
                routeCount: 0,
                candidateCount: 0,
                maxPly: 0,
                aborted: false,
                nodesPerSecond: 0,
                points: [],
                candidateMode: "legacy-getBlockVCF",
              };
            }

            const generated = oldGetBlockCandidates(baseBoard, attacker, rules, route, includeFour, maxNode);
            const points = [];
            let totalNodes = 0;
            let maxPly = 0;
            let aborted = false;
          '''
          new_guard = '''  if (!routeLen || (routeLen & 1) === 0) {
              return {
                nodeCount: 0,
                elapsedMs: performance.now() - startedAt,
                routeCount: 0,
                candidateCount: 0,
                maxPly: 0,
                aborted: false,
                nodesPerSecond: 0,
                points: [],
                candidateMode: "legacy-getBlockVCF",
              };
            }

            // 防點成立的前提是原始盤面上的指定手順本來確實獲勝。
            // 若攻方顏色、盤面或手順不相符，不能因每個預補點都驗證失敗而把全盤誤報為防點。
            writeBoard(baseBoard);
            const baselineValid = api.validate(
              ptr.board,
              attacker,
              rules,
              ptr.route,
              routeLen,
              maxNode,
              ptr.stats,
            );
            const baselineStats = readStats();
            if (!baselineValid || baselineStats.aborted) {
              return {
                ...baselineStats,
                elapsedMs: performance.now() - startedAt,
                routeCount: 0,
                candidateCount: 0,
                points: [],
                candidateMode: baselineStats.aborted ? "baseline-aborted" : "invalid-route",
              };
            }

            const generated = oldGetBlockCandidates(baseBoard, attacker, rules, route, includeFour, maxNode);
            const points = [];
            let totalNodes = baselineStats.nodeCount || 0;
            let maxPly = baselineStats.maxPly || 0;
            let aborted = false;
          '''
          if worker.count(old_guard) != 1:
              raise SystemExit('getBlockVCF baseline target block not found exactly once')
          worker = worker.replace(old_guard, new_guard, 1)
          worker_path.write_text(worker, encoding='utf-8')

          spec_path = Path('新版Bitboard VCF規格.MD')
          spec = spec_path.read_text(encoding='utf-8')
          old_spec = '''- 「VCF 防守」針對目前顯示路線取得直接防守點。
          - 「全部 VCF 防守」先取得候選防點，再逐點放入守方棋，排除放入後仍有 VCF 的位置。
          '''
          new_spec = '''- 「VCF 防守」針對目前顯示路線取得直接防守點。
          - 單一路線防守必須使用產生目前手順時記錄的攻方顏色，不得改用當下「分析色」；白方手順若以黑方身分重播會造成全盤空點誤判。
          - 計算防點前必須先在原始盤面驗證指定路線確實成立；原路線無效或驗證中止時回傳空集合，不得進入全盤逐點防守判定。
          - 「全部 VCF 防守」先取得候選防點，再逐點放入守方棋，排除放入後仍有 VCF 的位置。
          '''
          if spec.count(old_spec) != 1:
              raise SystemExit('VCF defense spec block not found exactly once')
          spec = spec.replace(old_spec, new_spec, 1)
          spec_path.write_text(spec, encoding='utf-8')

          Path('.github/workflows/fix-route-defense-color-once.yml').unlink()
          PY

      - name: Verify JavaScript and native engine
        shell: bash
        run: |
          set -euxo pipefail
          node --check rapfi/rapfi-bitboard-dashboard.js
          node --check rapfi/vcf-bitboard-worker.js
          python3 <<'PY'
          from pathlib import Path
          text = Path('makevcf.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.index('</script>', start)
          Path('/tmp/makevcf-inline.js').write_text(text[start:end], encoding='utf-8')
          assert 'const color = lastVCFColor;' in text
          assert 'lastVCFColor = color;' in text
          assert 'const baselineValid = api.validate(' in Path('rapfi/vcf-bitboard-worker.js').read_text(encoding='utf-8')
          PY
          node --check /tmp/makevcf-inline.js
          g++ rapfi/vcf-pattern-engine-optimized.cpp \
              rapfi/vcf-bitboard-engine.cpp \
              rapfi/vcf-bitboard-search-v2.cpp \
              rapfi/vcf-bitboard-legacy-extra.cpp \
              -O3 -flto -DNDEBUG -std=c++17 \
              -DVCF_BITBOARD_TEST_MAIN \
              -o /tmp/vcf-bitboard-engine-test
          /tmp/vcf-bitboard-engine-test
          git diff --check

      - name: Commit directly to main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '修正單一路線防守使用錯誤攻方顏色'
          git push origin HEAD:main
