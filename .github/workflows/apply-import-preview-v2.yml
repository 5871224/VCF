name: Apply image import preview v2

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-import-preview-v2.part0
      - scripts/apply-import-preview-v2.part1
      - scripts/apply-import-preview-v2.part2
      - scripts/apply-import-preview-v2.part3
      - .github/workflows/apply-import-preview-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply, validate, and record result
        shell: bash
        run: |
          set +e
          LOG=/tmp/apply-import-preview-v2.log
          : > "$LOG"
          {
            echo "commit=$GITHUB_SHA"
            echo "started=$(date -u +%FT%TZ)"
            cat scripts/apply-import-preview-v2.part0 \
                scripts/apply-import-preview-v2.part1 \
                scripts/apply-import-preview-v2.part2 \
                scripts/apply-import-preview-v2.part3 \
              | base64 -d | gunzip > /tmp/apply-import-preview-v2.js
            DECODE_STATUS=$?
            echo "decode_status=$DECODE_STATUS"
            if [ "$DECODE_STATUS" -eq 0 ]; then
              node --check /tmp/apply-import-preview-v2.js
              PATCH_SYNTAX_STATUS=$?
              echo "patch_syntax_status=$PATCH_SYNTAX_STATUS"
              if [ "$PATCH_SYNTAX_STATUS" -eq 0 ]; then
                node /tmp/apply-import-preview-v2.js
                APPLY_STATUS=$?
              else
                APPLY_STATUS=89
              fi
            else
              APPLY_STATUS=90
            fi
            echo "apply_status=$APPLY_STATUS"
            if [ "$APPLY_STATUS" -eq 0 ]; then
              python - <<'PY'
          from pathlib import Path
          text = Path('makevcf.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/makevcf-inline.js').write_text(text[start:end], encoding='utf-8')
          for token in ('btn-import-back', 'OUTER_MARGIN_CELLS', 'refineWarpedIntersections', 'editPreviewPoint'):
              if token not in text:
                  raise RuntimeError(f'Missing generated token: {token}')
          PY
              PY_STATUS=$?
              echo "python_validation_status=$PY_STATUS"
              node --check /tmp/makevcf-inline.js
              JS_STATUS=$?
              echo "generated_js_status=$JS_STATUS"
              git diff --check
              DIFF_STATUS=$?
              echo "diff_status=$DIFF_STATUS"
              if [ "$PY_STATUS" -ne 0 ] || [ "$JS_STATUS" -ne 0 ] || [ "$DIFF_STATUS" -ne 0 ]; then
                APPLY_STATUS=91
              fi
            fi
            echo "finished=$(date -u +%FT%TZ)"
            echo "final_status=$APPLY_STATUS"
          } >> "$LOG" 2>&1

          mkdir -p .github/diagnostics
          cp "$LOG" .github/diagnostics/apply-import-preview-v2.txt
          cat "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$APPLY_STATUS" -eq 0 ]; then
            git add makevcf.html README.md 規格書.MD .github/diagnostics/apply-import-preview-v2.txt
            git commit -m "重寫圖片匯入預覽與棋子辨識"
          else
            git add .github/diagnostics/apply-import-preview-v2.txt
            git commit -m "記錄圖片匯入預覽套用診斷"
          fi
          git push
          exit "$APPLY_STATUS"
