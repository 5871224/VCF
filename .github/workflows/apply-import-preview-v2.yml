name: Apply image import preview v2

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-import-preview-v2.js.gz.b64
      - .github/workflows/apply-import-preview-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decode patch script
        run: |
          set -euxo pipefail
          base64 -d scripts/apply-import-preview-v2.js.gz.b64 | gunzip > /tmp/apply-import-preview-v2.js
          node --check /tmp/apply-import-preview-v2.js

      - name: Apply changes
        run: node /tmp/apply-import-preview-v2.js

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('makevcf.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/makevcf-inline.js').write_text(text[start:end], encoding='utf-8')
          for token in ('btn-import-back', 'OUTER_MARGIN_CELLS', 'refineWarpedIntersections', 'editPreviewPoint'):
              if token not in text:
                  raise RuntimeError(f'Missing generated token: {token}')
          PY
          node --check /tmp/makevcf-inline.js

      - name: Check patch
        run: git diff --check

      - name: Commit result
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html README.md 規格書.MD
          git commit -m "重寫圖片匯入預覽與棋子辨識"
          git push
