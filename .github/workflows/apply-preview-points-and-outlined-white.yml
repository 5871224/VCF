name: Apply preview points and outlined white fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply-preview-points-and-outlined-white.js
      - .github/workflows/apply-preview-points-and-outlined-white.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply changes
        run: node tools/apply-preview-points-and-outlined-white.js

      - name: Validate generated page and fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('makevcf.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/makevcf-inline.js').write_text(html[start:end], encoding='utf-8')
          for token in (
              'const outlinedWhiteCircle =',
              'srcCtx.strokeRect(left, top, right - left, bottom - top);',
              'srcCtx.arc(point.x, point.y, step * 0.065, 0, Math.PI * 2);',
          ):
              if token not in html:
                  raise RuntimeError(f'Missing generated token: {token}')
          preview = html[html.index('  function renderRecognitionPreview()'):html.index('\n  function recognizeBoard()', html.index('  function renderRecognitionPreview()'))]
          for token in ('for (const x of importState.gridXs)', 'for (const y of importState.gridYs)', 'if (!stone) {'):
              if token in preview:
                  raise RuntimeError(f'Obsolete preview token remains: {token}')
          PY
          node --check /tmp/makevcf-inline.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('makevcf.html', 'utf8');
          const start = html.indexOf('  function computeCircleOccupancy(');
          const end = html.indexOf('\n  function extractCellFeatures(', start);
          if (start < 0 || end < 0) throw new Error('Cannot extract computeCircleOccupancy');
          const clamp01 = value => Math.max(0, Math.min(1, value));
          eval(html.slice(start, end));
          const radial = (dominantCoverage, absoluteMedian, signedMedian, blackCoverage, whiteCoverage) => ({
            dominantCoverage,
            absoluteMedian,
            signedMedian,
            blackCoverage,
            whiteCoverage,
          });
          const black = computeCircleOccupancy(radial(0.90, 80, 95, 0.90, 0.00), -90, -30, 0.05);
          const photoWhite = computeCircleOccupancy(radial(0.90, 70, -80, 0.00, 0.90), 78, 38, 0.05);
          const outlinedWhite = computeCircleOccupancy(radial(0.98, 15, -15, 0.00, 0.98), 12, 36, 0.05);
          const glare = computeCircleOccupancy(radial(0.54, 16, -11, 0.00, 0.54), 29, 2, 0.10);
          const gridPoint = computeCircleOccupancy(radial(0.12, 4, 0, 0.08, 0.04), -22, -12, 0.85);
          if (!black.candidate) throw new Error('Black stone fixture rejected');
          if (!photoWhite.candidate) throw new Error('Photo white stone fixture rejected');
          if (!outlinedWhite.candidate || !outlinedWhite.outlinedWhiteCircle || outlinedWhite.score < 0.62) {
            throw new Error('Outlined white fixture rejected');
          }
          if (glare.candidate) throw new Error('Broad glare fixture accepted');
          if (gridPoint.candidate) throw new Error('Empty grid point fixture accepted');
          NODE
          git diff --check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makevcf.html 規格書.MD
          git commit -m "調整辨識預覽與白色描邊棋子"
          git push
