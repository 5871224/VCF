name: One-time VCF calculation display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-vcf-calculation-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply calculation display patch
        shell: bash
        run: |
          set -euxo pipefail
          python tools/one_time_vcf_calculation_display.py
          node --check makevcf-layout.js
          node --check rapfi/rapfi-bitboard-dashboard.js
          npm run test:architecture
          git diff --check

      - name: Commit calculation display
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makevcf-layout.js rapfi/rapfi-bitboard-dashboard.js makevcf.html tests/workbench-architecture.test.js '規格書.MD'
          git commit -m 'Separate VCF calculation playback from record navigation'
          git push
