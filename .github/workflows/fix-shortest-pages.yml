name: Fix shortest VCF Pages deployment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-shortest-pages.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-shortest-vcf-pages
          fetch-depth: 0
      - name: Apply deployment fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('vcf-bitboard-engine-lto-v2-', 'vcf-bitboard-engine-lto-v3-')
          old = "'_vcfBbFindModeV3','_vcfBbValidateRoute'"
          new = "'_vcfBbFindModeV3','_vcfBbFindShortestOne','_vcfBbValidateRoute'"
          if old not in text:
              raise SystemExit('Pages Wasm export anchor not found')
          text = text.replace(old, new, 1)
          old = 'const findModeV3 = module.cwrap("vcfBbFindModeV3", "number", Array(13).fill("number"));\n            const scanModeV3'
          new = 'const findModeV3 = module.cwrap("vcfBbFindModeV3", "number", Array(13).fill("number"));\n            const findShortestOne = module.cwrap("vcfBbFindShortestOne", "number", Array(9).fill("number"));\n            const scanModeV3'
          if old not in text:
              raise SystemExit('Pages ABI cwrap anchor not found')
          text = text.replace(old, new, 1)
          old = 'if (typeof findModeV3 !== "function" || typeof scanModeV3 !== "function") {'
          new = 'if (typeof findModeV3 !== "function" || typeof findShortestOne !== "function" || typeof scanModeV3 !== "function") {'
          if old not in text:
              raise SystemExit('Pages ABI assertion anchor not found')
          text = text.replace(old, new, 1)
          old = '<script src="rapfi/rapfi-bitboard-dashboard.js"></script>'
          new = '<script src="rapfi/rapfi-bitboard-dashboard.js"></script>\n          <script src="rapfi/vcf-shortest-vcf-ui.js"></script>'
          if old not in text:
              raise SystemExit('Pages UI injection anchor not found')
          text = text.replace(old, new, 1)
          old = "assert 'rapfi-bitboard-dashboard.js' in rapfi_text"
          new = "assert 'rapfi-bitboard-dashboard.js' in rapfi_text\n          assert 'vcf-shortest-vcf-ui.js' in rapfi_text"
          if old not in text:
              raise SystemExit('Pages UI assertion anchor not found')
          text = text.replace(old, new, 1)
          old = 'grep -n "vcf-bitboard-main\\|makevcf-generator-core\\|rapfi-bitboard-dashboard" _site/rapfi/index.html'
          new = 'grep -n "vcf-bitboard-main\\|makevcf-generator-core\\|rapfi-bitboard-dashboard\\|vcf-shortest-vcf-ui" _site/rapfi/index.html'
          if old not in text:
              raise SystemExit('Pages grep anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git add .github/workflows/pages.yml
          git commit -m "修正最短 VCF Pages 部署"
          git push origin HEAD:agent/fix-shortest-vcf-pages
