name: Apply record DB model

on:
  push:
    paths:
      - .github/workflows/apply-record-db-model.yml
      - tools/apply-record-db-model.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply-record-db-model.py
      - name: Verify
        run: |
          node --check rapfi/rapfi-workbench-header.js
          node --check makevcf-layout.js
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapfi/rapfi-workbench-header.js makevcf-layout.js tests/workbench-architecture.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "改用 Rapfi DB 棋譜模型保存手順與注譯"
          git push origin HEAD:main
