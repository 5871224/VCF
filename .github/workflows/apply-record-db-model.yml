name: Apply record DB model

on:
  push:
    paths:
      - .github/workflows/apply-record-db-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Rapfi record model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              result, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 replacement, got {count}")
              return result

          # ------------------------------------------------------------
          # Rapfi YXDB / RenLib export: preserve actual board history.
          # ------------------------------------------------------------
          path = Path('rapfi/rapfi-workbench-header.js')
          s = path.read_text(encoding='utf-8')

          setup_replacement = r'''  function boardsEqual(left, right) {
    for (let i = 0; i < BOARD_CELLS; i++) {
      if (Number(left[i] || 0) !== Number(right[i] || 0)) return false;
    }
    return true;
  }

  function normalizeSetupHistory(history, rootBoard) {
    if (!Array.isArray(history)) return null;
    const replay = new Uint8Array(BOARD_CELLS);
    const normalized = [];
    let expectedStone = BLACK;
    for (const raw of history) {
      const index = Number(raw?.index ?? raw?.move);
      const stone = Number(raw?.stone ?? raw?.color);
      if (!Number.isInteger(index) || index < 0 || index >= BOARD_CELLS) return null;
      if (stone !== expectedStone || replay[index] !== EMPTY) return null;
      replay[index] = stone;
      normalized.push({
        index,
        stone,
        recordText: typeof raw?.recordText === "string" ? raw.recordText : "",
      });
      expectedStone = expectedStone === BLACK ? WHITE : BLACK;
    }
    return boardsEqual(replay, rootBoard) ? normalized : null;
  }

  // Rapfi YXDB is a position DAG. The exported branch must contain the path
  // from the empty board to the selected root. Unlike the old implementation,
  // this path is now the user's actual move history instead of a coordinate-sort
  // reconstruction, so the intended game order is preserved as far as YXDB's
  // symmetry/transposition model allows.
  function addYXDBSetupPath(rootBoard, add, history, historyExact) {
    const setupBoard = new Uint8Array(BOARD_CELLS);
    add(setupBoard);
    const stoneCount = countStones(rootBoard);
    if (stoneCount.black + stoneCount.white === 0) return;
    if (historyExact === false) {
      throw new Error("目前盤面沒有可驗證的原始落子 history；請清空棋盤後依原手順重新落子，再匯出 DB。 ");
    }
    const setupHistory = normalizeSetupHistory(history, rootBoard);
    if (!setupHistory) {
      throw new Error("目前盤面的落子 history 與棋盤不一致；為避免匯出錯誤手順，請清空後依原手順重新落子。 ");
    }
    for (const move of setupHistory) {
      setupBoard[move.index] = move.stone;
      add(setupBoard, move.recordText);
    }
  }
'''
          s = sub_once(
              s,
              r'\s*// Rapfi YXDB is a position DAG\. A portable branch database must also.*?\n\}\n\n(?=  function collectYXDBPositions)',
              '\n' + setup_replacement + '\n',
              'replace setup path',
              re.S,
          )

          s = s.replace(
              'function collectYXDBPositions(rootBoard, routes, attacker, rule) {',
              'function collectYXDBPositions(rootBoard, routes, attacker, rule, history = [], historyExact = true) {',
              1,
          )
          s = s.replace(
              '''    const add = board => {
      assertRapfiPosition(board);
      const key = yxdbKeyBytes(board, rule);
      records.set(keyString(key), { key });
    };

    addYXDBSetupPath(rootBoard, add);''',
              '''    const add = (board, text = "") => {
      assertRapfiPosition(board);
      const key = yxdbKeyBytes(board, rule);
      const id = keyString(key);
      const existing = records.get(id);
      if (existing) {
        if (!existing.text && text) existing.text = String(text);
      } else {
        records.set(id, { key, text: String(text || "") });
      }
    };

    addYXDBSetupPath(rootBoard, add, history, historyExact);''',
              1,
          )
          s = s.replace(
              'function createYXDB({ board, routes = [], attacker = 0, rule = 2 }) {',
              'function createYXDB({ board, routes = [], attacker = 0, rule = 2, history = [], historyExact = true }) {',
              1,
          )
          s = s.replace(
              'const records = collectYXDBPositions(normalizedBoard, routeList, side, normalizedRule);',
              'const records = collectYXDBPositions(normalizedBoard, routeList, side, normalizedRule, history, historyExact);',
              1,
          )
          s = s.replace(
              '''    for (const record of records) {
      writer.u16(record.key.length);
      writer.raw(record.key);
      writer.u16(5);
      writer.u8(0xff); // Database::LABEL_NONE (-1)
      writer.u16(0);   // value
      writer.u16(0);   // depth/bound
    }''',
              '''    for (const record of records) {
      const textBytes = encoder.encode(record.text || "");
      writer.u16(record.key.length);
      writer.raw(record.key);
      writer.u16(5 + textBytes.length);
      writer.u8(0xff); // Database::LABEL_NONE (-1)
      writer.u16(0);   // value
      writer.u16(0);   // depth/bound
      writer.raw(textBytes);
    }''',
              1,
          )

          # RenLib should use the same real setup history when available.
          s = s.replace(
              'function buildRenLibTree(rootBoard, routes, attacker) {',
              'function buildRenLibTree(rootBoard, routes, attacker, history = [], historyExact = true) {',
              1,
          )
          s = s.replace(
              '''    const root = makeTreeNode();
    const setup = deterministicSetupMoves(rootBoard, routeList.length ? attacker : 0);
    let setupTail = root;
    for (const move of setup.moves) setupTail = appendChild(setupTail, move);''',
              '''    const root = makeTreeNode();
    const stoneCount = countStones(rootBoard);
    const setupHistory = normalizeSetupHistory(history, rootBoard);
    let setupMoves;
    if (stoneCount.black + stoneCount.white === 0) {
      setupMoves = [];
    } else if (historyExact !== false && setupHistory) {
      setupMoves = setupHistory.map(move => move.index);
    } else {
      throw new Error("目前盤面沒有可驗證的原始落子 history；為避免 LIB 手順改變，請清空後依原手順重新落子。 ");
    }
    let setupTail = root;
    for (const move of setupMoves) setupTail = appendChild(setupTail, move);''',
              1,
          )
          s = s.replace(
              'function createRenLib({ board, routes = [], attacker = 0 }) {\n    const normalizedBoard = normalizeBoard(board);\n    const tree = buildRenLibTree(normalizedBoard, routes, Number(attacker));',
              'function createRenLib({ board, routes = [], attacker = 0, history = [], historyExact = true }) {\n    const normalizedBoard = normalizeBoard(board);\n    const tree = buildRenLibTree(normalizedBoard, routes, Number(attacker), history, historyExact);',
              1,
          )

          # Install a persistent board + history record model without touching the Bitboard search path.
          marker = '  function activeExportData() {'
          if marker not in s:
              raise SystemExit('activeExportData marker not found')
          record_model = r'''  function installWorkbenchRecordState() {
    const STORAGE_KEY = "vcf_board_history_v2";
    const readBoard = () => normalizeBoard(global._getArr?.());
    const replay = history => {
      const board = new Uint8Array(BOARD_CELLS);
      let expected = BLACK;
      if (!Array.isArray(history)) return null;
      for (const raw of history) {
        const index = Number(raw?.index ?? raw?.move);
        const stone = Number(raw?.stone ?? raw?.color);
        if (!Number.isInteger(index) || index < 0 || index >= BOARD_CELLS || stone !== expected || board[index]) return null;
        board[index] = stone;
        expected = oppositeStone(expected);
      }
      return board;
    };
    const oppositeStone = stone => stone === BLACK ? WHITE : BLACK;
    let history = [];
    let exact = false;
    let lastBoard = readBoard();

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      const restored = replay(saved?.history);
      if (restored && boardsEqual(restored, lastBoard)) {
        history = saved.history.map(item => ({
          index: Number(item.index),
          stone: Number(item.stone),
          recordText: typeof item.recordText === "string" ? item.recordText : "",
        }));
        exact = saved.exact !== false;
      }
    } catch (_) {}
    if (!lastBoard.some(Boolean)) {
      history = [];
      exact = true;
    }

    const persist = () => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ history, exact })); } catch (_) {}
    };
    const setState = (nextHistory, nextExact, board = readBoard()) => {
      const normalized = Array.isArray(nextHistory) ? nextHistory.map(item => ({
        index: Number(item.index ?? item.move),
        stone: Number(item.stone ?? item.color),
        recordText: typeof item.recordText === "string" ? item.recordText : "",
      })) : [];
      const rebuilt = replay(normalized);
      history = rebuilt && boardsEqual(rebuilt, board) ? normalized : [];
      exact = Boolean(nextExact && rebuilt && boardsEqual(rebuilt, board));
      if (!board.some(Boolean)) exact = true;
      lastBoard = new Uint8Array(board);
      persist();
    };
    const syncAfterManualEdit = () => {
      const board = readBoard();
      const changed = [];
      for (let i = 0; i < BOARD_CELLS; i++) if (board[i] !== lastBoard[i]) changed.push(i);
      if (changed.length === 1 && exact) {
        const index = changed[0];
        const before = lastBoard[index];
        const after = board[index];
        if (!before && (after === BLACK || after === WHITE)) {
          const expected = history.length % 2 === 0 ? BLACK : WHITE;
          if (after === expected) history.push({ index, stone: after, recordText: "" });
          else exact = false;
        } else if (before && !after) {
          const tail = history[history.length - 1];
          if (tail?.index === index && tail?.stone === before) history.pop();
          else exact = false;
        } else {
          exact = false;
        }
      } else if (changed.length) {
        exact = false;
      }
      lastBoard = board;
      persist();
    };

    const boardSvg = document.getElementById("board-svg");
    boardSvg?.addEventListener("click", () => queueMicrotask(syncAfterManualEdit));

    const originalSetBoardArr = global._setBoardArr;
    if (typeof originalSetBoardArr === "function" && !originalSetBoardArr.__recordStateWrapped) {
      const wrapped = function(arr, next = 1, options = null) {
        const result = originalSetBoardArr.call(this, arr, next);
        const board = readBoard();
        if (options && Array.isArray(options.history)) setState(options.history, options.exact !== false, board);
        else setState([], false, board);
        return result;
      };
      wrapped.__recordStateWrapped = true;
      global._setBoardArr = wrapped;
    }

    const originalClearBoard = global._clearBoard;
    if (typeof originalClearBoard === "function" && !originalClearBoard.__recordStateWrapped) {
      const wrappedClear = function(...args) {
        const result = originalClearBoard.apply(this, args);
        setState([], true, readBoard());
        return result;
      };
      wrappedClear.__recordStateWrapped = true;
      global._clearBoard = wrappedClear;
    }

    global.VCFWorkbenchRecord = {
      snapshot() {
        return { history: history.map(item => ({ ...item })), exact, board: Array.from(lastBoard) };
      },
      setHistory(nextHistory, nextExact = true) { setState(nextHistory, nextExact, readBoard()); },
      invalidate() { setState([], false, readBoard()); },
    };
    persist();
  }

  installWorkbenchRecordState();

'''
          s = s.replace(marker, record_model + marker, 1)

          s = s.replace(
              '''    const rule = Number(document.querySelector('input[name="rules"]:checked')?.value ?? 2);
    return { board, routes, attacker, rule };''',
              '''    const rule = Number(document.querySelector('input[name="rules"]:checked')?.value ?? 2);
    const recordState = global.VCFWorkbenchRecord?.snapshot?.() || { history: [], exact: !board.some(Boolean) };
    return { board, routes, attacker, rule, history: recordState.history, historyExact: recordState.exact };''',
              1,
          )

          path.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # Workbench layout: four fixed navigation buttons + YXDB text.
          # ------------------------------------------------------------
          path = Path('makevcf-layout.js')
          s = path.read_text(encoding='utf-8')

          old_nav = r'''  const prevStepButton = document\.createElement\("button"\);.*?  let replaySignature = "";'''
          new_nav = r'''  const prevStepButton = document.createElement("button");
  prevStepButton.id = "btn-vcf-step-prev";
  prevStepButton.type = "button";
  prevStepButton.textContent = "上一步";
  const nextStepButton = document.createElement("button");
  nextStepButton.id = "btn-vcf-step-next";
  nextStepButton.type = "button";
  nextStepButton.textContent = "下一步";
  const previousBranchButton = document.createElement("button");
  previousBranchButton.id = "btn-vcf-branch-prev";
  previousBranchButton.type = "button";
  previousBranchButton.textContent = "前一分支";
  const nextBranchButton = document.createElement("button");
  nextBranchButton.id = "btn-vcf-branch-next";
  nextBranchButton.type = "button";
  nextBranchButton.textContent = "後一分支";
  const legacyPreviousBranchButton = document.getElementById("btn-vcf-prev");
  const legacyNextBranchButton = document.getElementById("btn-vcf-next");
  if (legacyPreviousBranchButton) legacyPreviousBranchButton.hidden = true;
  if (legacyNextBranchButton) legacyNextBranchButton.hidden = true;
  const recordNavigationActions = document.getElementById("vcf-record-navigation-actions");
  recordNavigationActions?.append(prevStepButton, nextStepButton, previousBranchButton, nextBranchButton);

  const recordComment = document.createElement("div");
  recordComment.id = "vcf-record-comment";
  recordComment.className = "vcf-record-comment";
  recordComment.textContent = "注譯：—";
  recordNavigation.appendChild(recordComment);

  let replaySignature = "";'''
          s = sub_once(s, old_nav, new_nav, 'replace fixed navigation', re.S)

          # Extend record nodes with Rapfi DB text metadata.
          s = s.replace(
              'function makeRecordNode({ move = null, board: nodeBoard = null, sideToMove = BLACK, ply = 0, rule = null, synthetic = false, navigable = true } = {}) {',
              'function makeRecordNode({ move = null, board: nodeBoard = null, sideToMove = BLACK, ply = 0, rule = null, synthetic = false, navigable = true, recordText = "", comment = "", boardTexts = [] } = {}) {',
              1,
          )
          s = s.replace(
              '''      selectedChild: 0,
    };''',
              '''      selectedChild: 0,
      recordText,
      comment,
      boardTexts: Array.isArray(boardTexts) ? boardTexts.map(item => ({ ...item })) : [],
    };''',
              1,
          )

          # Return the transform used to orient a canonical YXDB child.
          s = s.replace(
              'return { board: candidate, move: additions === 1 ? added : PASS_MOVE };',
              'return { board: candidate, move: additions === 1 ? added : PASS_MOVE, transform };',
              1,
          )

          parse_helpers = r'''  function rapfiHexCoord(char) {
    if (/^[0-9]$/.test(char)) return char.charCodeAt(0) - 48;
    if (/^[A-F]$/i.test(char)) return char.toUpperCase().charCodeAt(0) - 55;
    return -1;
  }

  function parseRapfiRecordText(text) {
    const raw = String(text || "").replace(/\0+$/g, "");
    const boardTexts = [];
    let comment = raw;
    if (raw.startsWith("@BTXT@")) {
      const separator = raw.indexOf("\b");
      const segment = raw.slice(6, separator >= 0 ? separator : raw.length);
      comment = separator >= 0 ? raw.slice(separator + 1) : "";
      for (const line of segment.split("\n")) {
        if (line.length <= 2) continue;
        const x = rapfiHexCoord(line[0]);
        const y = rapfiHexCoord(line[1]);
        if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
          boardTexts.push({ x, y, text: line.slice(2) });
        }
      }
    }
    return { comment: comment.replace(/\b/g, "\n").trim(), boardTexts };
  }

  function orientBoardTexts(boardTexts, transform) {
    return (boardTexts || []).map(item => {
      const [x, y] = transformXY(item.x, item.y, transform);
      return { x, y, text: item.text };
    });
  }

'''
          s = s.replace('  function parseYXDB(rawBytes) {', parse_helpers + '  function parseYXDB(rawBytes) {', 1)

          # Parse DBRecord payload instead of skipping it.
          s = s.replace(
              '''      const valueLength = reader.u16();
      reader.skip(valueLength);''',
              '''      const valueLength = reader.u16();
      const valueBytes = reader.take(valueLength);
      const recordText = valueLength > 5 ? new TextDecoder("utf-8").decode(valueBytes.subarray(5)) : "";
      const recordMeta = parseRapfiRecordText(recordText);''',
              1,
          )
          s = s.replace(
              '''        ply: slotCount,
        rule,
      });''',
              '''        ply: slotCount,
        rule,
        recordText,
        comment: recordMeta.comment,
        boardTexts: recordMeta.boardTexts,
      });''',
              1,
          )

          s = s.replace(
              '''          sideToMove: record.sideToMove,
          ply: record.ply,
          rule: record.rule,
        });''',
              '''          sideToMove: record.sideToMove,
          ply: record.ply,
          rule: record.rule,
          recordText: record.recordText,
          comment: record.comment,
          boardTexts: orientBoardTexts(record.boardTexts, oriented.transform),
        });''',
              1,
          )
          s = s.replace(
              'node = makeRecordNode({ board: record.board, sideToMove: record.sideToMove, ply: record.ply, rule: record.rule });',
              'node = makeRecordNode({ board: record.board, sideToMove: record.sideToMove, ply: record.ply, rule: record.rule, recordText: record.recordText, comment: record.comment, boardTexts: record.boardTexts });',
              1,
          )

          # Dedicated overlay for Rapfi @BTXT@ markers and a visible comment line.
          render_helpers = r'''  function renderRecordAnnotations(node) {
    if (recordComment) recordComment.textContent = node?.comment ? `注譯：${node.comment}` : "注譯：—";
    let layer = board.querySelector("#vcf-record-text-layer");
    if (!layer) {
      layer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      layer.id = "vcf-record-text-layer";
      layer.setAttribute("pointer-events", "none");
      board.appendChild(layer);
    }
    while (layer.firstChild) layer.firstChild.remove();
    for (const item of node?.boardTexts || []) {
      const x = Number(item.x);
      const y = Number(item.y);
      if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) continue;
      const cx = 22 + x * 34;
      const cy = 22 + y * 34;
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", 10.5);
      circle.setAttribute("fill", "#fff7c2");
      circle.setAttribute("stroke", "#b56b00");
      circle.setAttribute("stroke-width", "1.6");
      layer.appendChild(circle);
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", cx);
      text.setAttribute("y", cy);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "central");
      text.setAttribute("font-size", "10");
      text.setAttribute("font-weight", "700");
      text.setAttribute("fill", "#6b3b00");
      text.textContent = String(item.text || "");
      layer.appendChild(text);
    }
  }

  function historyForImportedNode(node) {
    const reversed = [];
    let cursor = node;
    while (cursor?.parent) {
      if (Number.isInteger(cursor.move) && cursor.move >= 0) {
        reversed.push({
          index: cursor.move,
          stone: opposite(cursor.sideToMove),
          recordText: cursor.recordText || "",
        });
      }
      cursor = cursor.parent;
    }
    return reversed.reverse();
  }

'''
          s = s.replace('  function renderImportedNode(node) {', render_helpers + '  function renderImportedNode(node) {', 1)
          s = s.replace(
              'const applyBoard = () => window._setBoardArr?.(Array.from(node.board), node.sideToMove);',
              'const applyBoard = () => window._setBoardArr?.(Array.from(node.board), node.sideToMove, { history: historyForImportedNode(node), exact: true, source: "record-playback" });',
              1,
          )
          s = s.replace(
              '''    updateImportedBranchButtons();
    importedStatus();''',
              '''    renderRecordAnnotations(node);
    updateImportedBranchButtons();
    importedStatus();''',
              1,
          )

          # Fixed branch buttons drive either imported tree siblings or current VCF groups.
          old_handlers = r'''  previousBranchButton\?\.addEventListener\("click", \(\) => \{.*?  nextBranchButton\?\.addEventListener\("click", \(\) => \{.*?  \}\);'''
          new_handlers = r'''  previousBranchButton.addEventListener("click", () => {
    if (moveImportedBranch(-1)) return;
    if (typeof vcfGroups !== "undefined" && Array.isArray(vcfGroups) && vcfGroups.length && typeof setVcfGroup === "function") {
      if (Number(vcfGroupIdx) > 0) setVcfGroup(Number(vcfGroupIdx) - 1);
      else if (typeof setStatus === "function") setStatus("目前已是第一個 VCF 分支");
      replaySignature = "";
      replayPly = 0;
      return;
    }
    if (typeof setStatus === "function") setStatus("目前沒有可切換的前一分支");
  });
  nextBranchButton.addEventListener("click", () => {
    if (moveImportedBranch(1)) return;
    if (typeof vcfGroups !== "undefined" && Array.isArray(vcfGroups) && vcfGroups.length && typeof setVcfGroup === "function") {
      if (Number(vcfGroupIdx) < vcfGroups.length - 1) setVcfGroup(Number(vcfGroupIdx) + 1);
      else if (typeof setStatus === "function") setStatus("目前已是最後一個 VCF 分支");
      replaySignature = "";
      replayPly = 0;
      return;
    }
    if (typeof setStatus === "function") setStatus("目前沒有可切換的後一分支");
  });'''
          s = sub_once(s, old_handlers, new_handlers, 'replace branch handlers', re.S)

          # Do not refer to hidden legacy buttons in imported-state cleanup exceptions.
          s = s.replace(
              '["btn-vcf-step-prev", "btn-vcf-step-next", "btn-vcf-prev", "btn-vcf-next"].includes(id)',
              '["btn-vcf-step-prev", "btn-vcf-step-next", "btn-vcf-branch-prev", "btn-vcf-branch-next"].includes(id)',
              1,
          )

          # Style annotation row.
          s = s.replace(
              '''    #vcf-record-navigation-actions button {
      min-height: 38px;''',
              '''    #vcf-record-navigation-actions button {
      min-height: 38px;''',
              1,
          )
          style_anchor = '    .vcf-record-navigation-actions {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 6px;\n      width: 100%;\n    }\n'
          if style_anchor in s and '.vcf-record-comment {' not in s:
              s = s.replace(style_anchor, style_anchor + '''\n    .vcf-record-comment {\n      width: 100%;\n      min-height: 32px;\n      padding: 7px 9px;\n      border: 1px solid var(--vcf-line);\n      border-radius: 6px;\n      background: #fffdf5;\n      color: var(--vcf-text);\n      font-size: 13px;\n      line-height: 1.45;\n      white-space: pre-wrap;\n    }\n''', 1)

          path.write_text(s, encoding='utf-8')

          # Lightweight regression assertions for the new contract.
          test = Path('tests/workbench-architecture.test.js')
          t = test.read_text(encoding='utf-8')
          additions = '''\n// Rapfi DB-backed record model contract.\nassert.ok(layout.includes('btn-vcf-branch-prev'), '棋譜導覽需固定包含前一分支按鈕');\nassert.ok(layout.includes('btn-vcf-branch-next'), '棋譜導覽需固定包含後一分支按鈕');\nassert.ok(layout.includes('parseRapfiRecordText'), 'YXDB loader 必須解析 Rapfi record text');\nassert.ok(layout.includes('vcf-record-text-layer'), '工作台必須顯示 Rapfi @BTXT@ 盤面標記');\nassert.ok(header.includes('VCFWorkbenchRecord'), '盤面必須保存可匯出的落子 history');\nassert.ok(header.includes('normalizeSetupHistory'), 'YXDB setup path 必須以實際 history 驗證');\n'''
          if 'Rapfi DB-backed record model contract' not in t:
              t += additions
              test.write_text(t, encoding='utf-8')
          PY

      - name: Verify JavaScript and tests
        run: |
          node --check rapfi/rapfi-workbench-header.js
          node --check makevcf-layout.js
          npm test

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapfi/rapfi-workbench-header.js makevcf-layout.js tests/workbench-architecture.test.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "改用 Rapfi DB 棋譜模型保存手順與注譯"
          git push origin HEAD:main
