name: Refactor Generator Event Replay Phase 3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v6
        with:
          ref: agent/generator-event-replay-phase3
          fetch-depth: 0

      - name: Check whether refactor is already applied
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[event phase3 applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply event replay refactor
        if: steps.guard.outputs.skip != 'true'
        run: python tools/refactor-generator-event-replay-phase3.py

      - name: Check generator JavaScript syntax
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          for file in makevcf-generator-*.js; do
            node --check "$file"
          done

      - name: Run event, context and replay tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          node tests/generator-source-order.test.js
          node tests/generator-context.test.js
          node tests/generator-layout-replay.test.js
          node tools/apply-generator-replay-event-fixes.js
          node tools/apply-image-import-build-fixes.js
          git diff --check

      - name: Commit refactored sources
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm tools/refactor-generator-event-replay-phase3.py
          rm tools/.generator-event-replay-phase3-payload-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/refactor-generator-event-replay-phase3.yml'
          git commit -m "改用單一事件式題目回放 [event phase3 applied]"
          git push origin HEAD:agent/generator-event-replay-phase3
