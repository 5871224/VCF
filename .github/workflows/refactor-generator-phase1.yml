name: Prepare Generator Phase 1 Workflows

on:
  push:
    branches:
      - agent/refactor-generator-phase1
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/refactor-generator-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/refactor-generator-phase1

      - name: Prepare non-mutating Pages workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          verification = '''          python - <<'PY'
          from pathlib import Path

          index_path = Path("_site/index.html")
          index_text = index_path.read_text(encoding="utf-8")
          assert index_path.is_file()
          assert Path("_site/rapfi/lab.html").is_file()
          for removed in (
              "_site/makevcf.html",
              "_site/pattern-compare.html",
              "_site/pattern-compare.js",
              "_site/rapfi/index.html",
              "_site/rapfi/generator-flowchart.html",
          ):
              assert not Path(removed).exists(), removed
          for token in (
              "vcf-bitboard-main.js",
              "makevcf-generator-core.js",
              "makevcf-generator-target-board-v3.js",
              "makevcf-generator-defense-points.js",
              "makevcf-generator-progress.js",
              "rapfi-bitboard-dashboard.js",
              "vcf-shortest-vcf-ui.js",
              "vcf-forbidden-overlay.js",
          ):
              assert token in index_text, token
          assert "installRootBitboardFeatures" not in index_text
          PY
'''
          text = text[:start] + verification + text[end + len(end_marker):]
          path.write_text(text, encoding='utf-8')

      - name: Prepare generator CI workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/vcf-generator-ci.yml')
          text = path.read_text(encoding='utf-8')
          path_marker = "      - 'makevcf-generator-*.js'\n"
          extra_paths = """      - 'makevcf-generator-*.js'
      - 'makevcf.html'
      - 'makevcf-mobile.js'
      - 'makevcf-optimized-search-v2.js'
      - 'eval/Evaluator.js'
      - 'tools/apply-*-build-fixes.js'
      - 'tools/apply-generator-replay-event-fixes.js'
      - 'tests/generator-source-order.test.js'
"""
          if "tests/generator-source-order.test.js" not in text:
              text = text.replace(path_marker, extra_paths, 1)
          test_marker = """      - name: Test generator layout and unified replay
        run: node tests/generator-layout-replay.test.js
"""
          test_block = test_marker + """
      - name: Verify generator source order and non-mutating build
        run: node tests/generator-source-order.test.js
"""
          if "Verify generator source order and non-mutating build" not in text:
              text = text.replace(test_marker, test_block, 1)
          path.write_text(text, encoding='utf-8')

      - name: Upload workflow updates
        uses: actions/upload-artifact@v4
        with:
          name: generator-phase1-workflows
          path: |
            .github/workflows/pages.yml
            .github/workflows/vcf-generator-ci.yml
          if-no-files-found: error
