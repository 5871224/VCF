name: Apply Project Cleanup

on:
  push:
    branches: [agent/project-cleanup]
    paths:
      - '.github/workflows/apply-project-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/project-cleanup
          fetch-depth: 0

      - name: Reconstruct cleanup payload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .project-cleanup-work
          cat .project-cleanup-payload/part-* | base64 -d > .project-cleanup-work/payload.tar.gz
          echo "fdb5d267eae3f3c836c7335b513929c945afc12801ca9f3f6fa63733a7736e22  .project-cleanup-work/payload.tar.gz" | sha256sum -c -
          tar -xzf .project-cleanup-work/payload.tar.gz -C .project-cleanup-work
          bash .project-cleanup-work/apply.sh

      - name: Validate project cleanup
        shell: bash
        run: |
          set -euxo pipefail
          npm test
          npm run verify:source
          python -m py_compile tools/prepare-pages-site.py
          test ! -e app
          test ! -e cpp
          test ! -e vcf-live-four-grouping-option.js
          test ! -e rapfi/vcf-bitboard-worker-v4.js
          test ! -e rapfi/vcf-first-nontarget-worker.js
          test ! -e eval/engine.js
          test ! -e VCF介面規格.MD
          test ! -e 介面配置規格.MD
          test ! -e .project-cleanup-payload
          test ! -e .github/workflows/apply-project-cleanup.yml

      - name: Commit project cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "移除桌面版並整理工作台架構"
          git push origin HEAD:agent/project-cleanup
